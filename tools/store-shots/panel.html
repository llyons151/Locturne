<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Panel</title>
  <link rel="stylesheet" href="/panel.css">
</head>
<body>
  <div class="panel" id="panel"></div>
  <script>
    // Renders panels.json → panels[i] at full size. Used for export and, scaled down, for every preview.
    // Stripped back to the phone and its screenshot on a plain background (user 2026-11-02: start from
    // scratch and tweak from there). Headlines, skies, frost, Loc and callouts are still in panels.json, just
    // not drawn; the old page is in git history (before this change).
    const i = Number(new URLSearchParams(location.search).get('i') ?? 0);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    // 3D phones across seams: panels.json → strip.phones are placed on the whole set laid side by side
    // (strip x: panel n starts at (n-1)×1320), so a phone on a seam shows half in each panel and carries over
    // when you swipe. Each is a real render from phone3d/ (angle name from `phone3d/compose.py list`).
    const PANEL_W = 1320;
    async function stripPhones(strip) {
      const out = [];
      for (const ph of strip?.phones ?? []) {
        const h = ph.height ?? 2300;
        if (Math.abs(ph.x - (i * PANEL_W + PANEL_W / 2)) > PANEL_W / 2 + h) continue;   // nowhere near this panel
        const src = `/api/phone?angle=${encodeURIComponent(ph.angle)}&shot=${encodeURIComponent(ph.shot)}&roll=${ph.roll ?? 0}`;
        out.push(`<img class="phone3d" src="${src}" alt="" style="left:${ph.x - i * PANEL_W}px;top:${ph.y ?? 1434}px;height:${h}px">`);
      }
      return out.join('');
    }

    fetch('/panels.json', { cache: 'no-store' }).then((r) => r.json()).then(async ({ panels, strip }) => {
      const p = panels[i];
      const shotUrl = `/shots/${encodeURIComponent(p.shot ?? '')}`;
      const has = p.shot && (await fetch(shotUrl, { method: 'HEAD', cache: 'no-store' })).ok;
      const screen = has
        ? `<img src="${shotUrl}?v=${Date.now()}" alt="">`
        : `<div class="missing"><b>${esc(p.shot || 'no screenshot set')}</b><span>${esc(p.note)}</span></div>`;
      // "phone": false on a panel drops its flat centred phone (for panels whose phone comes from strip.phones).
      document.getElementById('panel').innerHTML = (p.phone === false ? '' :
        `<div class="phone"><div class="bezel"><div class="screen"><div class="island"></div>${screen}</div></div></div>`)
        + await stripPhones(strip);
      document.body.dataset.ready = '1';
    });
  </script>
</body>
</html>
