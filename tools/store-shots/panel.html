<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Panel</title>
  <link rel="stylesheet" href="/panel.css">
</head>
<body>
  <div class="panel" id="panel"></div>
  <script>
    // Renders panels.json → panels[i] at full size. Used for export and, scaled down, for every preview.
    // Stripped back to the phone and its screenshot on a plain background (user 2026-11-02: start from
    // scratch and tweak from there). Headlines, skies, frost, Loc and callouts are still in panels.json, just
    // not drawn; the old page is in git history (before this change).
    const i = Number(new URLSearchParams(location.search).get('i') ?? 0);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    // Phone looks (panels.json → strip): strip.layout picks a list of phones from strip.layouts ("flat" = none, so
    // every panel keeps its plain centred phone; "3d" = real 3D renders from phone3d/). Phones are placed on the whole
    // set laid side by side (strip x: panel n starts at (n-1)×1320), so one on a seam shows half in each panel and
    // carries over when you swipe. A phone with "panel": n replaces that panel's flat phone. strip.glass picks the
    // render set (original / soft). ?layout= and ?glass= override, for side-by-side previews.
    const PANEL_W = 1320;
    const q = new URLSearchParams(location.search);
    function stripPhones(strip) {
      const list = strip?.layouts?.[q.get('layout') ?? strip.layout] ?? [];
      const glass = q.get('glass') ?? strip?.glass ?? 'original';
      const own = list.some((ph) => ph.panel === i);
      const html = list.map((ph, n) => [ph, n]).filter(([ph]) => Math.abs(ph.x - (i * PANEL_W + PANEL_W / 2)) < PANEL_W / 2 + (ph.height ?? 2300))
        .map(([ph, n]) => {
          const src = `/api/phone?angle=${encodeURIComponent(ph.angle)}&shot=${encodeURIComponent(ph.shot)}&roll=${ph.roll ?? 0}&glass=${glass}`;
          return `<img class="phone3d" data-edit="wb:${n}" src="${src}" alt="" style="left:${ph.x - i * PANEL_W}px;top:${ph.y ?? 1434}px;height:${ph.height ?? 2300}px">`;
        }).join('');
      return { own, html };
    }

    fetch('/panels.json', { cache: 'no-store' }).then((r) => r.json()).then(async ({ panels, strip }) => {
      const p = panels[i];
      const shotUrl = `/shots/${encodeURIComponent(p.shot ?? '')}`;
      const has = p.shot && (await fetch(shotUrl, { method: 'HEAD', cache: 'no-store' })).ok;
      const screen = has
        ? `<img src="${shotUrl}?v=${Date.now()}" alt="">`
        : `<div class="missing"><b>${esc(p.shot || 'no screenshot set')}</b><span>${esc(p.note)}</span></div>`;
      const phones = stripPhones(strip);
      document.getElementById('panel').innerHTML = (phones.own ? '' :
        `<div class="phone"><div class="bezel"><div class="screen"><div class="island"></div>${screen}</div></div></div>`)
        + phones.html;
      if (q.get('edit')) await new Promise((ok) => { const sc = document.createElement('script'); sc.src = '/edit-hook.js'; sc.onload = ok; document.head.appendChild(sc); });
      document.body.dataset.ready = '1';
    });
  </script>
</body>
</html>
