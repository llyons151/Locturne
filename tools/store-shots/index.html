<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store shots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ui-bg: #111214; --ui-panel: #1a1b1e; --ui-line: #2a2b30; --ui-text: #ececf0; --ui-dim: #9a9ba3;
      /* App Store mock, light */
      --as-bg: #ffffff; --as-text: #000000; --as-dim: #8a8a8e; --as-line: #e3e3e8; --as-fill: #f2f2f7;
      --as-blue: #007aff; --as-get: #eef0f5;
    }
    .dark-store { --as-bg: #000000; --as-text: #ffffff; --as-dim: #8d8d93; --as-line: #2c2c2e; --as-fill: #1c1c1e; --as-blue: #0a84ff; --as-get: #2c2c2e; }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font: 14px/1.4 Inter, -apple-system, system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 12px 20px;
      background: var(--ui-bg); border-bottom: 1px solid var(--ui-line); }
    header h1 { margin: 0 16px 0 0; font-size: 15px; font-weight: 700; }
    header .spacer { flex: 1; }
    button, select, input, textarea { font: inherit; color: inherit; }
    .tab, .btn { border: 1px solid var(--ui-line); background: var(--ui-panel); color: var(--ui-text); border-radius: 8px;
      padding: 6px 12px; cursor: pointer; }
    .tab.on { background: var(--ui-text); color: var(--ui-bg); border-color: var(--ui-text); }
    #status { color: var(--ui-dim); font-size: 12px; margin-right: 8px; }
    main { padding: 24px 20px 60px; }

    /* Scaled live panel: an iframe at full 1320×2868, shrunk to the box. */
    .shot { position: relative; overflow: hidden; background: #000; flex: none; }
    .shot.thumb { background: #1a1b1e center / cover no-repeat; }
    .shot.thumb img { display: block; width: 100%; height: 100%; opacity: 0; }
    .shot iframe { position: absolute; top: 0; left: 0; width: 1320px; height: 2868px; border: 0; transform-origin: 0 0; pointer-events: none; }

    /* Panels view */
    .strip { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; }
    .card { cursor: pointer; border-radius: 10px; padding: 6px; border: 2px solid transparent; }
    .card.on { border-color: var(--ui-text); }
    .card .label { margin-top: 6px; color: var(--ui-dim); font-size: 12px; text-align: center; }
    .card .label b { color: var(--ui-text); }
    .editor { display: grid; grid-template-columns: auto 1fr; gap: 28px; margin-top: 24px; align-items: start; }
    .form { display: grid; gap: 12px; max-width: 560px; }
    .form label { display: grid; gap: 4px; color: var(--ui-dim); font-size: 12px; }
    .form input, .form textarea, .form select { background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 8px; padding: 8px 10px; color: var(--ui-text); }
    .form textarea { min-height: 70px; resize: vertical; }
    .hint { color: var(--ui-dim); font-size: 12px; }

    /* Edit: the whole set side by side, live, so phones crossing a seam can be dragged in either panel. */
    .ed-strip { display: flex; gap: 0; overflow-x: auto; padding-bottom: 12px; }
    .ed-strip .ed-cell { flex: none; }
    .ed-strip .shot iframe { pointer-events: auto; }
    .ed-strip .label { margin-top: 6px; color: var(--ui-dim); font-size: 12px; text-align: center; }
    .ed-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 0 0 14px; }
    .ed-bar label { display: grid; gap: 4px; color: var(--ui-dim); font-size: 12px; }
    .ed-bar input, .ed-bar select { background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 8px; padding: 6px 8px; color: var(--ui-text); width: 90px; }
    .ed-bar select { width: auto; }

    /* Mock iPhone + App Store */
    .stage { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
    .iphone { width: 393px; height: 852px; border-radius: 56px; border: 12px solid #000; background: var(--as-bg); color: var(--as-text);
      overflow: hidden; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,.5); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; }
    .iphone .scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
    .iphone .scroll::-webkit-scrollbar { display: none; }
    .statusbar { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-weight: 600; font-size: 16px; }
    .island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 3; }
    .caption { text-align: center; color: var(--ui-dim); margin-top: 12px; font-size: 12px; }

    .search-bar { margin: 4px 16px 10px; background: var(--as-fill); border-radius: 11px; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--as-text); font-size: 16px; }
    .search-bar .glass { color: var(--as-dim); }
    .result { padding: 6px 16px 18px; border-bottom: .5px solid var(--as-line); }
    .row { display: flex; align-items: center; gap: 12px; }
    .icon { border-radius: 22.5%; background: #333 center / cover; flex: none; border: .5px solid rgba(128,128,128,.25); }
    .meta { flex: 1; min-width: 0; }
    .meta .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta .subt { font-size: 13px; color: var(--as-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta .stars { font-size: 12px; color: var(--as-dim); margin-top: 2px; }
    .get { background: var(--as-get); color: var(--as-blue); font-weight: 700; font-size: 15px; border-radius: 999px; padding: 5px 20px; border: 0; }
    .iap { font-size: 9px; color: var(--as-dim); text-align: center; margin-top: 2px; }
    .trio { display: flex; gap: 8px; margin-top: 12px; }
    .trio .shot { border-radius: 10px; }
    .ghost .icon, .ghost .trio .shot { background: var(--as-fill); }
    .ghost .meta .name, .ghost .meta .subt { background: var(--as-fill); color: transparent; border-radius: 4px; width: 70%; margin-bottom: 4px; }

    .nav { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 6px; color: var(--as-blue); font-size: 17px; }
    .hero { display: flex; gap: 16px; padding: 8px 20px 16px; }
    .hero .name { font-size: 21px; font-weight: 700; line-height: 1.15; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .hero .subt { font-size: 15px; color: var(--as-dim); margin-top: 2px; white-space: normal; }
    .hero .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
    .hero .get { background: var(--as-blue); color: #fff; }
    .info { display: flex; overflow-x: auto; border-top: .5px solid var(--as-line); border-bottom: .5px solid var(--as-line); margin: 0 20px; padding: 10px 0; scrollbar-width: none; }
    .info div { flex: none; min-width: 104px; text-align: center; padding: 0 10px; border-left: .5px solid var(--as-line); }
    .info div:first-child { border-left: 0; }
    .info small { display: block; font-size: 10px; color: var(--as-dim); text-transform: uppercase; letter-spacing: .02em; }
    .info b { display: block; font-size: 17px; color: var(--as-dim); margin: 2px 0; }
    .info span { font-size: 11px; color: var(--as-dim); }
    .carousel { display: flex; gap: 10px; overflow-x: auto; padding: 16px 0 6px; scroll-snap-type: x mandatory; scroll-padding-left: 20px; scrollbar-width: none; }
    .carousel::before, .carousel::after { content: ''; flex: 0 0 10px; }
    .carousel .shot { border-radius: 16px; scroll-snap-align: start; }
    .device-label { padding: 2px 20px 12px; color: var(--as-dim); font-size: 13px; border-bottom: .5px solid var(--as-line); margin: 0 0 0; }
    .desc { padding: 14px 20px; font-size: 15px; line-height: 1.35; border-bottom: .5px solid var(--as-line); }
    .desc .more { color: var(--as-blue); }
    .dev { padding: 12px 20px 40px; display: flex; justify-content: space-between; color: var(--as-blue); font-size: 15px; }

    /* Web App Store (apps.apple.com/…/app/…, "App Store for iPhone"): how the listing looks in a desktop browser.
       Matches the layout in the user's 2026-11-02 screenshot; light/dark follows the App Store toggle. */
    main.web { padding: 0; }
    .web-store { --w-bg: #ffffff; --w-side: #f5f5f7; --w-line: #e0e0e5; --w-text: #1d1d1f; --w-dim: #6e6e73; --w-hero: linear-gradient(180deg, #e8e8ed, #f5f5f7);
      --w-blue: #0071e3; --w-search: #ffffff; display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 57px);
      background: var(--w-bg); color: var(--w-text); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; }
    .web-store.dark-store { --w-bg: #1d1d1f; --w-side: #232325; --w-line: #333336; --w-text: #f5f5f7; --w-dim: #a1a1a6;
      --w-hero: radial-gradient(120% 140% at 70% 0%, #5a5a5e 0%, #2b2b2e 45%, #1d1d1f 100%); --w-blue: #2997ff; --w-search: #1d1d1f; }
    .w-side { background: var(--w-side); border-right: 1px solid var(--w-line); padding: 28px 18px; position: sticky; top: 57px; height: calc(100vh - 57px); }
    .w-brand { font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin: 0 0 18px 4px; }
    .w-brand small { font-size: 12px; color: var(--w-dim); }
    .w-search { border: 1px solid var(--w-line); background: var(--w-search); border-radius: 8px; height: 32px; display: flex; align-items: center;
      gap: 8px; padding: 0 10px; color: var(--w-dim); font-size: 13px; margin-bottom: 22px; }
    .w-nav { list-style: none; margin: 0 0 18px; padding: 0; }
    .w-nav li { display: flex; align-items: center; gap: 12px; padding: 7px 6px; font-size: 15px; border-radius: 8px; }
    .w-nav li.on { background: var(--w-line); }
    .w-nav i { width: 20px; height: 20px; border-radius: 5px; background: var(--w-blue); flex: none; opacity: .9; }
    .w-cat { font-size: 11px; color: var(--w-dim); margin: 0 0 6px 6px; }
    .w-main { min-width: 0; }
    .w-hero { background: var(--w-hero); display: flex; align-items: center; gap: 34px; padding: 48px 44px; }
    .w-hero .icon { width: 190px; height: 190px; border-radius: 22.5%; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
    .w-hero h2 { margin: 0; font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.01em; }
    .w-hero .w-sub { font-size: 17px; font-weight: 600; color: var(--w-dim); margin-top: 8px; }
    .w-hero .w-price { font-size: 13px; color: var(--w-dim); margin-top: 10px; }
    .w-stats { display: grid; grid-template-columns: repeat(6, 1fr); padding: 26px 44px 22px; text-align: center; }
    .w-stats small { display: block; font-size: 11px; font-weight: 500; color: var(--w-dim); letter-spacing: .03em; text-transform: uppercase; }
    .w-stats b { display: block; font-size: 22px; font-weight: 700; margin: 6px 0 2px; }
    .w-stats span { font-size: 12px; color: var(--w-dim); }
    .w-shots { display: flex; gap: 20px; overflow-x: auto; padding: 4px 44px 24px; scroll-snap-type: x mandatory; scroll-padding-left: 44px; scrollbar-width: thin; }
    .w-shots .shot { border-radius: 22px; scroll-snap-align: start; border: 1px solid var(--w-line); }
    .w-device { padding: 0 44px 22px; color: var(--w-dim); font-size: 13px; }
    .w-text { padding: 0 44px 40px; max-width: 900px; font-size: 15px; line-height: 1.5; white-space: pre-line; }
    .w-text h3 { font-size: 22px; margin: 18px 0 10px; }

    /* All listings */
    .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(700px, 1fr)); gap: 14px; }
    .gal-row { display: flex; gap: 16px; padding: 14px; border: 2px solid var(--ui-line); border-radius: 14px; cursor: pointer; background: var(--ui-panel); }
    .gal-row.on { border-color: var(--ui-text); }
    .gal-row:hover { border-color: var(--ui-dim); }
    .gal-meta { width: 150px; flex: none; display: flex; flex-direction: column; gap: 6px; }
    .gal-meta b { font-size: 14px; }
    .gal-meta span { font-size: 12px; color: var(--ui-dim); line-height: 1.35; }
    .gal-shots { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Store shots</h1>
    <button class="tab" data-view="gallery">All listings</button>
    <button class="tab" data-view="edit">Edit</button>
    <button class="tab" data-view="panels">Panels</button>
    <button class="tab" data-view="search">Search result</button>
    <button class="tab" data-view="product">Product page</button>
    <button class="tab" data-view="web">Web App Store</button>
    <span class="spacer"></span>
    <span id="status"></span>
    <select class="btn" id="listing" title="Listing design (listings.json)"></select>
    <select class="btn" id="layout" title="Phone layout (panels.json → strip.layout)"></select>
    <select class="btn" id="glass" title="3D phone glass (panels.json → strip.glass)">
      <option value="original">Glass: original</option><option value="soft">Glass: softer</option></select>
    <button class="btn" id="mode">Dark App Store</button>
    <button class="btn" id="export">Export PNGs</button>
  </header>
  <main id="main"></main>

  <script>
    const W = 1320, H = 2868;
    let data, shots = [], view = new URLSearchParams(location.search).get('view') || localStorage.getItem('view') || 'panels', sel = Number(localStorage.getItem('sel') || 0);
    // The listing design being viewed ('' = the plain workbench panels). Kept per viewer, not in panels.json, so
    // switching is instant once a listing's thumbnails exist.
    let listing = new URLSearchParams(location.search).get('listing') ?? localStorage.getItem('listing') ?? '';
    let lib = { listings: [] };
    let dark = (new URLSearchParams(location.search).get('dark') ?? localStorage.getItem('dark')) === '1';
    const $ = (s, el = document) => el.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    // A panel at a given width. Small ones are PNG thumbnails the server renders once per change (live full-size
    // panels with the frost's blurs lagged the page); only the big editor preview is live. While a new thumbnail
    // renders, the previous one stays underneath it.
    const lastThumb = (window.lastThumb = {});
    function shot(i, width, radius, live = false, which = listing) {
      const s = width / W;
      const box = `width:${width}px;height:${Math.round(H * s)}px${radius ? `;border-radius:${radius}px` : ''}`;
      if (live) return `<div class="shot" style="${box}">
        <iframe src="${which ? `/listing.html?listing=${encodeURIComponent(which)}&` : '/panel.html?'}i=${i}&t=${Date.now()}" style="transform:scale(${s})" loading="lazy"></iframe></div>`;
      const key = `${which}-${i}`;
      const prev = lastThumb[key] ? `;background-image:url('${lastThumb[key]}')` : '';
      return `<div class="shot thumb" style="${box}${prev}">
        <img src="/api/thumb?i=${i}&listing=${encodeURIComponent(which)}&v=${encodeURIComponent(version ?? '')}" alt="" loading="lazy" onload="lastThumb['${key}']=this.src;this.style.opacity=1"></div>`;
    }

    function phone(inner, caption) {
      return `<div><div class="iphone ${dark ? 'dark-store' : ''}"><div class="island"></div><div class="scroll">
        <div class="statusbar"><span>9:41</span><span>●●● ▮</span></div>${inner}</div></div>
        <div class="caption">${caption}</div></div>`;
    }

    function iconStyle(size) { return `width:${size}px;height:${size}px;background-image:url('${data.app.icon}')`; }

    function renderPanels() {
      const p = data.panels[sel];
      const options = [...new Set([p.shot, ...shots])].filter(Boolean)
        .map((s) => `<option ${s === p.shot ? 'selected' : ''}>${esc(s)}</option>`).join('');
      return `
        <div class="strip">${data.panels.map((q, i) => `
          <div class="card ${i === sel ? 'on' : ''}" data-i="${i}">${shot(i, 170, 12)}
            <div class="label"><b>${i + 1}</b> · ${esc(q.id)}${i < 3 ? ' · in search' : ''}</div></div>`).join('')}
        </div>
        <div class="editor">
          ${shot(sel, 400, 22, true)}
          <div class="form">
            <label>Headline<textarea id="f-headline">${esc(p.headline)}</textarea></label>
            <label>Subline (optional)<input id="f-sub" value="${esc(p.sub)}"></label>
            <label>Screenshot (file in tools/store-shots/shots/)<select id="f-shot">${options}</select></label>
            <label>Phone top (px, default 640)<input id="f-phoneTop" type="number" value="${esc(p.phoneTop ?? '')}"></label>
            <label>What to capture<textarea id="f-note">${esc(p.note)}</textarea></label>
            <div><button class="btn" id="save">Save panel ${sel + 1}</button></div>
            <p class="hint">Panels 1–3 are the ones people see in search results. Drop new captures into
              <code>tools/store-shots/shots/</code>; the page picks them up on its own. Edits to panels.json from Claude show up live too.</p>
          </div>
        </div>`;
    }

    function renderSearch() {
      const app = data.app;
      const real = `
        <div class="result"><div class="row">
          <div class="icon" style="${iconStyle(62)}"></div>
          <div class="meta"><div class="name">${esc(app.name)}</div><div class="subt">${esc(app.subtitle)}</div>
            <div class="stars">New</div></div>
          <div><button class="get">${esc(app.price)}</button>${app.inAppPurchases ? '<div class="iap">In-App Purchases</div>' : ''}</div>
        </div>
        <div class="trio">${[0, 1, 2].map((i) => data.panels[i] ? shot(i, 113, 10) : '').join('')}</div></div>`;
      const ghost = `
        <div class="result ghost"><div class="row"><div class="icon" style="width:62px;height:62px"></div>
          <div class="meta"><div class="name">.</div><div class="subt">.</div></div><button class="get">Get</button></div>
          <div class="trio">${[0, 1, 2].map(() => '<div class="shot" style="width:113px;height:245px;border-radius:10px"></div>').join('')}</div></div>`;
      return `<div class="stage">${phone(`
        <div class="nav" style="color:var(--as-text);font-size:30px;font-weight:700;padding-top:4px">Search</div>
        <div class="search-bar"><span class="glass">⌕</span>morning app blocker</div>
        ${real}${ghost}`, 'Search results: only the icon, name, subtitle and first 3 panels show')}</div>`;
    }

    function renderProduct() {
      const app = data.app;
      const first = app.description.split('\n')[0];
      return `<div class="stage">${phone(`
        <div class="nav"><span>‹ Search</span><span></span></div>
        <div class="hero"><div class="icon" style="${iconStyle(118)}"></div>
          <div class="meta"><div class="name">${esc(app.name)}</div><div class="subt">${esc(app.subtitle)}</div>
            <div class="actions"><div><button class="get">${esc(app.price)}</button>${app.inAppPurchases ? '<div class="iap" style="text-align:left">In-App Purchases</div>' : ''}</div>
            <span style="color:var(--as-blue);font-size:20px">⇪</span></div></div></div>
        <div class="info">
          <div><small>Ratings</small><b>—</b><span>Not enough</span></div>
          <div><small>Age</small><b>${esc(app.age)}</b><span>Years Old</span></div>
          <div><small>Category</small><b>☾</b><span>${esc(app.category)}</span></div>
          <div><small>Developer</small><b>◎</b><span>${esc(app.developer)}</span></div>
          <div><small>Language</small><b>EN</b><span>English</span></div>
          <div><small>Size</small><b>${esc(app.size.split(' ')[0])}</b><span>MB</span></div>
        </div>
        <div class="carousel">${data.panels.map((_, i) => shot(i, 228, 16)).join('')}</div>
        <div class="device-label">▯ iPhone</div>
        <div class="desc">${esc(app.promo)}</div>
        <div class="desc">${esc(first)} <span class="more">more</span></div>
        <div class="dev"><span>${esc(app.developer)}</span><span>›</span></div>`, 'Product page: swipe the screenshots sideways')}</div>`;
    }

    // Every listing design side by side: its name, the idea behind it, and panels 1-3 as they'd show in search.
    function renderGallery() {
      return `<p class="hint" style="margin:0 0 18px">${lib.listings.length} designs. Each row is panels 1–3, what search shows. Click one to open it;
        then use Search result / Product page / Web App Store to see it in the store. Research: docs/reports/App Store screenshot conversion 2026.md</p>
        <div class="gal">${lib.listings.map((L, n) => `
        <div class="gal-row ${L.id === listing ? 'on' : ''}" data-id="${esc(L.id)}">
          <div class="gal-meta"><b>${n + 1}. ${esc(L.name)}</b><span>${esc(L.idea)}</span></div>
          <div class="gal-shots">${[0, 1, 2].map((i) => shot(i, 150, 12, false, L.id)).join('')}</div></div>`).join('')}</div>`;
    }

    // apps.apple.com in a desktop browser: sidebar, hero, stats row, then the panels at ~300px wide, side by side.
    function renderWeb() {
      const app = data.app;
      const side = ['Today', 'Games', 'Apps', 'Arcade'].map((t) => `<li><i></i>${t}</li>`).join('');
      const cats = ['Categories', 'Photo & Video', 'Health & Fitness', 'Productivity', 'Entertainment']
        .map((t) => `<li class="${t === app.category ? 'on' : ''}"><i></i>${esc(t)}</li>`).join('');
      const [num, unit] = String(app.size).split(' ');
      return `<div class="web-store ${dark ? 'dark-store' : ''}">
        <aside class="w-side">
          <div class="w-brand">App Store <small>for iPhone ⌄</small></div>
          <div class="w-search">⌕ Search</div>
          <ul class="w-nav">${side}</ul>
          <div class="w-cat">Categories</div>
          <ul class="w-nav">${cats}</ul>
        </aside>
        <div class="w-main">
          <div class="w-hero"><div class="icon" style="background-image:url('${app.icon}')"></div>
            <div><h2>${esc(app.name)}</h2><div class="w-sub">${esc(app.subtitle)}</div>
              <div class="w-price">${app.price === 'Get' ? 'Free' : esc(app.price)}${app.inAppPurchases ? ' · In-App Purchases' : ''} · Designed for iPhone</div></div></div>
          <div class="w-stats">
            <div><small>Ratings</small><b>—</b><span>Not enough</span></div>
            <div><small>Age rating</small><b>${esc(app.age)}</b><span>Years</span></div>
            <div><small>Category</small><b>☾</b><span>${esc(app.category)}</span></div>
            <div><small>Developer</small><b>◎</b><span>${esc(app.developer)}</span></div>
            <div><small>Language</small><b>EN</b><span>English</span></div>
            <div><small>Size</small><b>${esc(num)}</b><span>${esc(unit ?? '')}</span></div>
          </div>
          <div class="w-shots">${data.panels.map((_, i) => shot(i, 298, 22)).join('')}</div>
          <div class="w-device">▯ iPhone</div>
          <div class="w-text">${esc(app.promo)}<h3>Description</h3>${esc(app.description)}</div>
        </div></div>`;
    }

    function render() {
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.view === view));
      $('#mode').textContent = dark ? 'Light App Store' : 'Dark App Store';
      $('#main').classList.toggle('web', view === 'web');
      $('#main').innerHTML = view === 'edit' ? renderEdit() : view === 'gallery' ? renderGallery() : view === 'panels' ? renderPanels() : view === 'search' ? renderSearch()
        : view === 'web' ? renderWeb() : renderProduct();
      if (view === 'panels') wireEditor();
      if (view === 'edit') wireEdit();
      if (view === 'gallery') document.querySelectorAll('.gal-row').forEach((r) => r.onclick = () => pickListing(r.dataset.id, 'product'));
    }

    function wireEditor() {
      document.querySelectorAll('.card').forEach((c) => c.onclick = () => { sel = Number(c.dataset.i); localStorage.setItem('sel', sel); render(); });
      $('#save').onclick = async () => {
        const p = data.panels[sel];
        p.headline = $('#f-headline').value.trim();
        p.sub = $('#f-sub').value.trim();
        p.shot = $('#f-shot').value;
        p.note = $('#f-note').value.trim();
        const top = $('#f-phoneTop').value.trim();
        if (top) p.phoneTop = Number(top); else delete p.phoneTop;
        await fetch('/api/panels', { method: 'PUT', body: JSON.stringify(data, null, 2) + '\n' });
        status('Saved');
      };
    }

    // ── Edit tab ──────────────────────────────────────────────────────────────────────────────────────────────────
    // Every panel of the chosen listing (or the workbench) live and full-res, scaled down. Drag a phone, note, Loc or
    // caption; wheel = bigger/smaller, Shift+wheel = tilt; click selects it for exact numbers below. Listing phones
    // save to listings.json → listings[id].phones.edits[slot] (the shared pattern stays as it was), notes/caption/Loc
    // to listings[id].panels[panelId]; workbench phones to panels.json → strip.layouts[layout]. Ctrl+Z undoes.
    let edSel = null, edScale = Number(localStorage.getItem('edScale') || 0.22), angles = [];
    const undo = [];
    const edCount = () => listing ? (curListing().order ?? lib.order).length : data.panels.length;
    const curListing = () => lib.listings.find((x) => x.id === listing);
    const edSrc = (i) => `${listing ? `/listing.html?listing=${encodeURIComponent(listing)}&` : '/panel.html?'}i=${i}&edit=1&t=${Date.now()}`;

    function renderEdit() {
      const w = Math.round(W * edScale), h = Math.round(H * edScale);
      const order = listing ? (curListing().order ?? lib.order) : data.panels.map((p) => p.id);
      return `<div class="ed-bar">
          <label>Size<select id="ed-scale">${[0.16, 0.22, 0.3, 0.4].map((v) => `<option value="${v}" ${v === edScale ? 'selected' : ''}>${Math.round(v * 100)}%</option>`).join('')}</select></label>
          <span id="ed-fields"></span>
          <button class="btn" id="ed-undo">Undo</button>
          ${listing ? `<label>Add to the panel you last clicked<select id="ed-add"><option value="">+ Add…</option>${Object.keys(ADD).map((k) => `<option>${esc(k)}</option>`).join('')}</select></label>` : ''}
          <span class="hint">${listing ? esc(curListing().name) : 'Workbench (Phones: ' + esc(data.strip?.layout) + ')'} · drag phones, notes, Loc and captions ·
            wheel = size, Shift+wheel = tilt, click to retype · panels touch here, like the real swipe</span>
        </div>
        <div class="ed-strip">${order.map((id, i) => `<div class="ed-cell">
          <div class="shot" style="width:${w}px;height:${h}px"><iframe data-i="${i}" src="${edSrc(i)}" style="transform:scale(${edScale})"></iframe></div>
          <div class="label"><b>${i + 1}</b> · ${esc(id)}</div></div>`).join('')}</div>`;
    }

    function wireEdit() {
      $('#ed-scale').onchange = () => { edScale = Number($('#ed-scale').value); localStorage.setItem('edScale', edScale); render(); };
      $('#ed-undo').onclick = doUndo;
      // A panel that reloads after a save draws its selection outline again.
      document.querySelectorAll('.ed-strip iframe').forEach((f) => f.onload = () => setTimeout(() => f.contentWindow?.postMessage({ type: 'highlight', key: edSel }, '*'), 300));
      if ($('#ed-add')) $('#ed-add').onchange = () => { const v = $('#ed-add').value; $('#ed-add').value = ''; if (v) edAdd(v); };
      fields();
    }

    // The thing a key points at, as it renders now (pattern + saved edits), and where to save it.
    function edTarget(key) {
      const [kind, a, b] = key.split(':');
      if (kind === 'wb') { const list = data.strip.layouts[data.strip.layout]; return { kind, obj: list[a] }; }
      const L = curListing();
      if (kind === 'ph') {
        const pat = typeof L.phones.pattern === 'string' ? lib.patterns[L.phones.pattern] : L.phones.pattern;
        const base = pat.slots ? (pat.slots[a] ?? pat.slots[pat.slots.length - 1]) : pat.all;
        return { kind, L, slot: a, obj: { ...base, ...(L.phones.edits?.[a] ?? {}) }, scale: L.phones.scale ?? 1 };
      }
      const set = lib.copy?.[L.copy ?? 'default']?.[a] ?? {};
      const own = L.panels?.[a] ?? {};
      if (kind === 'item') { const items = ((L.panels ??= {})[a] ??= {}).items ??= []; return { kind, L, pid: a, n: Number(b), items, obj: items[b] }; }
      if (kind === 'note') return { kind, L, pid: a, n: Number(b), notes: structuredClone(own.notes ?? set.notes ?? []) };
      if (kind === 'copy') return { kind, L, pid: a, top: own.top ?? set.top ?? { ...lib.typeDefaults, ...L.type }.top ?? 230,
        bottom: { ...lib.typeDefaults, ...L.type }.position === 'bottom' };
      if (kind === 'loc') return { kind, L, pid: a, pos: { x: own.loc?.x ?? L.loc.x ?? 660, y: own.loc?.y ?? L.loc.y ?? 520 } };
    }
    const own = (L, pid) => ((L.panels ??= {})[pid] ??= {});

    // Apply a change: d = { dx, dy, dh, droll } in panel px (deltas) or set = exact values for a phone.
    async function edApply(key, d = {}, set = null) {
      const t = edTarget(key);
      if (!t) return;
      undo.push(JSON.stringify({ lib, strip: data.strip }));
      const dx = d.dx ?? 0, dy = d.dy ?? 0;
      if (t.kind === 'wb') {
        const o = t.obj;
        o.x = Math.round(o.x + dx); o.y = Math.round((o.y ?? 1434) + dy); o.height = Math.round((o.height ?? 2300) + (d.dh ?? 0));
        o.roll = (o.roll ?? 0) + (d.droll ?? 0);
        if (set) Object.assign(o, set);
      } else if (t.kind === 'ph') {
        const o = t.obj;
        const e = { angle: o.angle, x: Math.round(o.x + dx), y: Math.round((o.y ?? 1650) + dy),
          height: Math.round((o.height ?? 2250) + (d.dh ?? 0) / t.scale), roll: (o.roll ?? 0) + (d.droll ?? 0), ...(set ?? {}) };
        (t.L.phones.edits ??= {})[t.slot] = e;
      } else if (t.kind === 'item') {
        const o = t.obj;
        o.x = Math.round((o.x ?? 660) + dx); o.y = Math.round((o.y ?? 1434) + dy);
        if (d.dscale) o.scale = Math.round((o.scale ?? 1) * d.dscale * 1000) / 1000;
        if (d.drot) o.rot = (o.rot ?? 0) + d.drot;
        if (set) Object.assign(o, set);
      } else if (t.kind === 'note') {
        const n = t.notes[t.n];
        if (set) Object.assign(n, set); n.x = Math.round(n.x + dx); n.y = Math.round(n.y + dy);
        own(t.L, t.pid).notes = t.notes;
      } else if (t.kind === 'copy') {
        if (dy) own(t.L, t.pid).top = Math.round(t.top + (t.bottom ? -dy : dy));
        if (set) for (const [k, v] of Object.entries(set)) { if (v === null) delete own(t.L, t.pid)[k]; else own(t.L, t.pid)[k] = v; }
      } else if (t.kind === 'loc') {
        own(t.L, t.pid).loc = { x: Math.round(t.pos.x + dx), y: Math.round(t.pos.y + dy) };
      }
      await edSave(false, d.from ?? null);
    }

    async function edSave(reloadAll = false, from = null) {
      edSaving = Date.now();
      if (listing) await fetch('/api/listings', { method: 'PUT', body: JSON.stringify(lib, null, 1) + '\n' });
      else await fetch('/api/panels', { method: 'PUT', body: JSON.stringify(data, null, 2) + '\n' });
      document.querySelectorAll('.ed-strip iframe').forEach((f) => {
        if (reloadAll || from == null || Math.abs(Number(f.dataset.i) - from) <= 2) f.src = edSrc(f.dataset.i);
      });
      fields();
      status('Saved');
    }
    let edSaving = 0, edFrom = 0;

    // Add text or a graphic to the panel last clicked (listings only).
    const ADD = {
      text: { type: 'text', text: 'New *line*', size: 80, weight: 800 },
      note: { type: 'note', text: 'a note', arrow: 'down-left', ax: -120, ay: 90, aw: 160, rot: -5 },
      'note + underline': { type: 'note', text: 'a note', underline: true, rot: -4 },
      wordmark: { type: 'wordmark', size: 150 },
      chip: { type: 'chip', text: 'A short line' },
      ...Object.fromEntries(['moon-stars', 'zzz', 'footsteps', 'stairs', 'sunrise', 'sparkle', 'alarm', 'heart', 'bed']
        .map((k) => ['doodle: ' + k, { type: 'doodle', kind: k, w: 220, label: '' }])),
      'Loc peeking': { type: 'loc', w: 600 },
      'moon icon': { type: 'image', src: '/assets/moons/icons/full.webp', w: 500 },
      'sleeping apps': { type: 'apps', count: 12, cols: 3, size: 260, gap: 70 },
      'wake row': { type: 'row', icon: 'walk', title: 'Walk 200 steps', sub: 'Recommended', style: 'white', w: 1100 },
      'moon tiles': { type: 'moons', cols: 3, size: 320, locked: 2 },
      'progress bar': { type: 'bar', w: 900, value: 0.58 },
      'cut-out: step counter': { type: 'crop', shot: '02-steps.png', crop: [235, 960, 820, 640], w: 1100, radius: 70, shadow: 'deep' },
      'cut-out: bedtime ring': { type: 'crop', shot: '04-routine.png', crop: [195, 350, 900, 1080], w: 1000, radius: 80, shadow: 'deep' },
    };
    function edAdd(name) {
      if (!listing) return status('Adding items works on listings (pick one in the Listing menu)');
      const L = curListing(), pid = (L.order ?? lib.order)[edFrom];
      undo.push(JSON.stringify({ lib, strip: data.strip }));
      const items = own(L, pid).items ??= [];
      items.push({ ...structuredClone(ADD[name]), x: 660, y: 1434 });
      edSel = `item:${pid}:${items.length - 1}`;
      edSave(false, edFrom);
    }

    function doUndo() {
      const prev = undo.pop();
      if (!prev) return status('Nothing to undo');
      const o = JSON.parse(prev);
      lib = o.lib; data.strip = o.strip;
      edSave(true);
    }

    function resetSel() {
      const t = edTarget(edSel);
      if (!t || t.kind === 'wb') return;
      undo.push(JSON.stringify({ lib, strip: data.strip }));
      if (t.kind === 'item') { t.items.splice(t.n, 1); edSel = null; }
      else if (t.kind === 'ph') delete t.L.phones.edits[t.slot];
      else delete own(t.L, t.pid)[t.kind === 'note' ? 'notes' : t.kind === 'copy' ? 'top' : 'loc'];
      edSave(true);
    }

    // Exact numbers for the selected thing.
    function fields() {
      const box = $('#ed-fields');
      if (!box) return;
      document.querySelectorAll('.ed-strip iframe').forEach((f) => f.contentWindow?.postMessage({ type: 'highlight', key: edSel }, '*'));
      const t = edSel && edTarget(edSel);
      if (!t) { box.innerHTML = '<span class="hint">Click something to select it.</span>'; return; }
      const reset = t.kind === 'wb' ? '' : '<button class="btn" id="ed-reset">Reset</button>';
      if (t.kind === 'wb' || t.kind === 'ph') {
        const o = t.obj;
        box.innerHTML = `<span style="display:inline-flex;gap:10px;align-items:end">
          <label>Phone ${t.kind === 'ph' ? Number(t.slot) + 1 : ''} angle<select id="ed-angle">${angles.map((a) => `<option ${a === o.angle ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
          ${['x', 'y', 'height', 'roll'].map((k) => `<label>${k}<input type="number" data-k="${k}" value="${o[k] ?? ''}"></label>`).join('')}
          <button class="btn" id="ed-apply">Apply</button>${reset}</span>`;
        $('#ed-apply').onclick = () => {
          const set = { angle: $('#ed-angle').value };
          box.querySelectorAll('input[data-k]').forEach((inp) => set[inp.dataset.k] = Number(inp.value));
          edApply(edSel, {}, set);
        };
        $('#ed-angle').onchange = () => $('#ed-apply').click();
      } else if (t.kind === 'item') {
        const o = t.obj, keys = ['text', 'label', 'title', 'sub'].filter((k) => k in o);
        box.innerHTML = `<span style="display:inline-flex;gap:10px;align-items:end;flex-wrap:wrap">
          <label>${esc(o.type)}${o.kind ? ' · ' + esc(o.kind) : ''}</label>
          ${keys.map((k) => `<label>${k}<input data-k="${k}" style="width:280px" value="${esc(o[k])}"></label>`).join('')}
          ${['size', 'w', 'rot', 'scale'].filter((k) => k in o || k === 'rot' || k === 'scale').map((k) => `<label>${k}<input type="number" step="any" data-k="${k}" data-n="1" value="${o[k] ?? (k === 'scale' ? 1 : 0)}"></label>`).join('')}
          <label>colour<input data-k="color" style="width:110px" placeholder="default" value="${esc(o.color ?? '')}"></label>
          <button class="btn" id="ed-apply">Apply</button><button class="btn" id="ed-dup">Duplicate</button><button class="btn" id="ed-del">Delete</button></span>`;
        $('#ed-apply').onclick = () => {
          const set = {};
          box.querySelectorAll('input[data-k]').forEach((inp) => { set[inp.dataset.k] = inp.dataset.n ? Number(inp.value) : inp.value; });
          if (!set.color) { delete set.color; delete o.color; }
          edApply(edSel, {}, set);
        };
        $('#ed-dup').onclick = () => { undo.push(JSON.stringify({ lib, strip: data.strip })); t.items.push({ ...structuredClone(o), x: (o.x ?? 660) + 80, y: (o.y ?? 1434) + 80 });
          edSel = `item:${t.pid}:${t.items.length - 1}`; edSave(false, edFrom); };
        $('#ed-del').onclick = resetSel;
      } else if (t.kind === 'copy') {
        const c = { ...(lib.copy?.[t.L.copy ?? 'default']?.[t.pid] ?? {}), ...(t.L.panels?.[t.pid] ?? {}) };
        box.innerHTML = `<span style="display:inline-flex;gap:10px;align-items:end;flex-wrap:wrap">
          <label>Caption (*word* = highlighted)<input id="ed-h" style="width:420px" value="${esc(c.headline ?? '')}"></label>
          <label>Line under it<input id="ed-s" style="width:300px" value="${esc(c.sub ?? '')}"></label>
          <button class="btn" id="ed-apply">Apply</button>${reset}</span>`;
        $('#ed-apply').onclick = () => edApply(edSel, {}, { headline: $('#ed-h').value, sub: $('#ed-s').value || null });
      } else if (t.kind === 'note') {
        const n = t.notes[t.n];
        box.innerHTML = `<span style="display:inline-flex;gap:10px;align-items:end"><label>Note<input id="ed-n" style="width:300px" value="${esc(n.text)}"></label>
          <button class="btn" id="ed-apply">Apply</button>${reset}</span>`;
        $('#ed-apply').onclick = () => edApply(edSel, {}, { text: $('#ed-n').value });
      } else box.innerHTML = `<span class="hint" style="margin-right:8px">Selected: ${esc(edSel)}</span>${reset}`;
      $('#ed-reset')?.addEventListener('click', resetSel);
    }

    addEventListener('message', (e) => {
      if (view !== 'edit' || !e.data?.type) return;
      edFrom = e.data.from ?? edFrom;
      if (e.data.type === 'select') { edSel = e.data.key; fields(); }
      if (e.data.type === 'move') { edSel = e.data.key; edApply(e.data.key, e.data); }
    });
    addEventListener('keydown', (e) => {
      if (view === 'edit' && (e.ctrlKey || e.metaKey) && e.key === 'z' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) { e.preventDefault(); doUndo(); }
    });

    function status(t) { $('#status').textContent = t; clearTimeout(status.t); status.t = setTimeout(() => $('#status').textContent = '', 3000); }

    async function load() {
      data = await (await fetch('/panels.json', { cache: 'no-store' })).json();
      shots = await (await fetch('/api/shots', { cache: 'no-store' })).json();
      sel = Math.min(sel, data.panels.length - 1);
      lib = await (await fetch('/listings.json', { cache: 'no-store' })).json();
      if (!angles.length) angles = Object.keys(await (await fetch('/api/angles')).json());
      $('#listing').innerHTML = `<option value="">Listing: workbench</option>` + lib.listings.map((L, n) =>
        `<option value="${esc(L.id)}" ${L.id === listing ? 'selected' : ''}>${n + 1}. ${esc(L.name)}</option>`).join('');
      const st = data.strip ?? {};
      $('#layout').innerHTML = Object.keys(st.layouts ?? { flat: [] }).map((k) =>
        `<option value="${esc(k)}" ${k === st.layout ? 'selected' : ''}>Phones: ${esc(k)}</option>`).join('');
      $('#glass').value = st.glass ?? 'original';
      // The Edit tab reloads its own panels after a save; a full re-render would flash all ten.
      if (view === 'edit' && Date.now() - edSaving < 5000) return;
      render();
    }

    document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { view = t.dataset.view; localStorage.setItem('view', view); render(); });
    function pickListing(id, toView) {
      listing = id; localStorage.setItem('listing', id); $('#listing').value = id;
      if (toView) { view = toView; localStorage.setItem('view', view); }
      render();
    }
    $('#listing').onchange = () => pickListing($('#listing').value);

    // Phone look switches save to panels.json, so thumbnails, the store previews and Export all follow them.
    for (const key of ['layout', 'glass']) $('#' + key).onchange = async () => {
      data.strip[key] = $('#' + key).value;
      await fetch('/api/panels', { method: 'PUT', body: JSON.stringify(data, null, 2) + '\n' });
      status('Saved: ' + key + ' ' + data.strip[key]);
    };
    $('#mode').onclick = () => { dark = !dark; localStorage.setItem('dark', dark ? '1' : '0'); render(); };
    $('#export').onclick = async () => {
      status('Exporting…');
      const r = await fetch(`/api/export?listing=${encodeURIComponent(listing)}`, { method: 'POST' });
      status(r.ok ? `Exported ${(await r.json()).length} PNGs to tools/store-shots/export/${listing || 'workbench'}/` : 'Export failed: ' + await r.text());
    };

    // Live reload: when panels.json, the panel template or a shot changes on disk, re-render.
    let version = null;
    setInterval(async () => {
      const v = await (await fetch('/api/version', { cache: 'no-store' })).text();
      if (v !== version) { version = v; await load(); status('Updated'); }
    }, 1500);

    fetch('/api/version', { cache: 'no-store' }).then((r) => r.text()).then((v) => { version = v; load(); });
  </script>
</body>
</html>
