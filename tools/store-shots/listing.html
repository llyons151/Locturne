<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Listing panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&family=Instrument+Serif:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Nunito:wght@500..900&family=Caveat:wght@500..700&family=Manrope:wght@300..800&family=Space+Grotesk:wght@400..700&family=DM+Serif+Display:ital@0;1&display=block">
  <link rel="stylesheet" href="/listing.css">
</head>
<body>
  <div class="panel" id="panel"></div>
  <script>
    // One App Store panel (1320×2868) of one listing design: listings.json → listings[id], filled with panels.json's
    // screenshots. ?listing=<id>&i=<slot>. Everything strip-wide (backgrounds, phones on seams) is laid out on the
    // whole set side by side, so it carries across when you swipe. See listings.json → "doc" for every field.
    const W = 1320, H = 2868;
    const q = new URLSearchParams(location.search);
    const i = Number(q.get('i') ?? 0);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    let seed = 11;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    // Hand-drawn strokes (no fills, round caps): an underline swoosh, a loop circle, and arrows by direction.
    const SWOOSH = 'M6 22 C 120 8, 300 6, 520 14 C 600 17, 660 20, 694 26';
    const ARROWS = {
      'down-left': 'M190 10 C 200 90, 140 150, 30 170 M30 170 L 70 140 M30 170 L 72 192',
      'down-right': 'M20 10 C 10 90, 70 150, 180 170 M180 170 L 140 140 M180 170 L 138 192',
      'up-left': 'M190 190 C 200 110, 140 50, 30 30 M30 30 L 72 8 M30 30 L 70 60',
      'up-right': 'M20 190 C 10 110, 70 50, 180 30 M180 30 L 138 8 M180 30 L 140 60',
      'down': 'M100 10 C 130 70, 70 120, 100 185 M100 185 L 72 150 M100 185 L 126 152',
    };

    // Headline markup: *word* = the emphasis, styled by the listing's accent mode.
    function rich(s, t) {
      return esc(s).replace(/\*([^*]+)\*/g, (_, w) => {
        if (t.accent === 'underline') return `<em class="u">${w}<svg viewBox="0 0 700 34" preserveAspectRatio="none"><path d="${SWOOSH}"/></svg></em>`;
        if (t.accent === 'circle') return `<em class="c">${w}<svg viewBox="0 0 400 140" preserveAspectRatio="none"><path d="M330 20 C 250 0, 60 10, 20 60 C -5 100, 120 135, 260 125 C 390 115, 410 50, 300 18"/></svg></em>`;
        return `<em>${w}</em>`;
      });
    }

    function background(L, n) {
      const b = L.bg ?? { type: 'flat', color: '#fff' };
      const strip = (inner, style = '') => `<div class="strip" style="left:${-i * W}px;width:${n * W}px;${style}">${inner}</div>`;
      let base = '';
      if (b.type === 'flat') base = strip('', `background:${b.color}`);
      if (b.type === 'vertical') base = strip('', `background:linear-gradient(180deg, ${b.stops.join(', ')})`);
      if (b.type === 'across') {        // one colour per panel, blended across the seams
        const c = (k) => b.colors[k % b.colors.length];
        const stops = Array.from({ length: n }, (_, k) => `${c(k)} ${k * W + 160}px, ${c(k)} ${k * W + W - 160}px`).join(', ');
        base = strip(b.top ? `<div class="fill" style="background:linear-gradient(180deg, ${b.top} 0%, transparent ${b.topTo ?? 45}%)"></div>` : '',
          `background:linear-gradient(90deg, ${stops})`);
      }
      if (b.type === 'sky') {           // night → morning: each panel its own time, blended across the seams
        const t = (k) => b.times[k % b.times.length];
        const band = (key) => Array.from({ length: n }, (_, k) => `${t(k)[key]} ${k * W + 120}px, ${t(k)[key]} ${k * W + W - 120}px`).join(', ');
        const stars = Array.from({ length: n }, (_, k) => Array.from({ length: t(k).stars ?? 0 }, () => {
          const x = k * W + rand() * W, y = rand() ** 1.5 * (b.starsDepth ?? 1500), r = 1.4 + rand() * 2.4;
          return `<i class="star" style="left:${x | 0}px;top:${y | 0}px;width:${(r * 2).toFixed(1)}px;height:${(r * 2).toFixed(1)}px;opacity:${(0.25 + rand() * 0.6).toFixed(2)}"></i>`;
        }).join('')).join('');
        base = strip(`<div class="fill" style="background:linear-gradient(90deg, ${band('mid')})"></div>
          <div class="fill" style="background:linear-gradient(90deg, ${band('top')});-webkit-mask-image:linear-gradient(180deg,#000,transparent 55%)"></div>
          <div class="fill" style="background:linear-gradient(90deg, ${band('low')});-webkit-mask-image:linear-gradient(0deg,#000,transparent 55%)"></div>${stars}`);
      }
      if (b.type === 'panels') {        // one flat colour per panel, hard edges at the seams
        const stops = Array.from({ length: n }, (_, k) => `${b.colors[k % b.colors.length]} ${k * W}px ${(k + 1) * W}px`).join(', ');
        base = strip('', `background:linear-gradient(90deg, ${stops})`);
      }
      if (b.type === 'split') base = strip('', `background:linear-gradient(180deg, ${b.top} 0 ${b.at ?? 50}%, ${b.bottom} ${b.at ?? 50}% 100%)`);
      // Solid shapes on top (no blur): a horizon arc, rolling hills, or a big disc behind the phone.
      let shapes = '';
      for (const s of b.shapes ?? []) {
        if (s.type === 'hills') {
          const pts = []; for (let x = 0; x <= n * W; x += 220) pts.push([x, s.y + Math.sin(x / 900 + (s.phase ?? 0)) * (s.amp ?? 70)]);
          const d = `M0 ${H} L` + pts.map(([x, y]) => `${x} ${y | 0}`).join(' L') + ` L${n * W} ${H} Z`;
          shapes += strip(`<svg class="fill" viewBox="0 0 ${n * W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="${s.color}"/></svg>`);
        }
        if (s.type === 'arc') shapes += `<i class="arc" style="width:${s.r * 2}px;height:${s.r * 2}px;left:${W / 2 - s.r}px;top:${s.y}px;background:${s.color}"></i>`;
        if (s.type === 'disc') shapes += `<i class="arc" style="width:${s.r * 2}px;height:${s.r * 2}px;left:${(s.x ?? W / 2) - s.r}px;top:${s.y - s.r}px;background:${s.color}"></i>`;
      }
      // Mist: big soft smears of the sky's own shades across the whole strip, Opal-style (user-asked blur, 2026-11-03).
      // Seeded, so every panel draws the same strip and the smears carry across the seams.
      if (b.mist) {
        const m = b.mist;
        // A sky time may carry its own mist shades (a warm sunrise panel): a smear takes the palette of the panel it sits in.
        const palette = (x) => (b.times?.[Math.max(0, Math.min(n - 1, Math.floor(x / W))) % (b.times?.length || 1)]?.mist) ?? m.colors;
        const smears = Array.from({ length: (m.count ?? 6) * n }, () => {
          const w = 700 + rand() * 1700, h = 200 + rand() * 700, x = rand() * n * W - w / 2;
          const y = (m.top ?? 700) + rand() * (H - (m.top ?? 700)) - h / 2, rot = -10 + rand() * 20;
          const cols = palette(x + w / 2), c = cols[(rand() * cols.length) | 0], o = (m.opacity ?? 0.5) * (0.5 + rand() * 0.5);
          return `<i class="smear" style="left:${x | 0}px;top:${y | 0}px;width:${w | 0}px;height:${h | 0}px;background:${c};opacity:${o.toFixed(2)};transform:rotate(${rot.toFixed(1)}deg);filter:blur(${m.blur ?? 110}px)"></i>`;
        }).join('');
        base += strip(smears);
      }
      let tex = '';
      if (b.texture === 'grain') tex = `<div class="grain" style="opacity:${b.grain ?? 0.08}"></div>`;
      if (b.texture === 'grid') tex = `<div class="grid" style="--line:${b.line ?? 'rgba(0,0,0,.06)'}"></div>`;
      if (b.texture === 'dots') tex = `<div class="dots" style="--line:${b.line ?? 'rgba(0,0,0,.12)'}"></div>`;
      return base + shapes + tex;
    }

    // Phones for slot k of a pattern (panel-local coords). A phone whose x runs past 0..1320 shows in the neighbour.
    function phonesFor(L, pattern, panels, k) {
      const list = pattern.slots ? (pattern.slots[k] ?? pattern.slots[pattern.slots.length - 1]) : pattern.all;
      // listings.json → phones.edits[slot] holds what was dragged in the Edit tab; it replaces the pattern's slot.
      // listings[id].panels.<id>.shot swaps the capture for this listing only (e.g. a cleaned copy).
      const shot = L.panels?.[panels[k]?.id]?.shot ?? panels[k]?.shot;
      return [].concat(list ?? []).map((ph) => ({ ...ph, ...(L.phones.edits?.[k] ?? {}), slot: k, shot }));
    }

    function phoneHtml(L, ph, x0) {
      const kind = L.phones.kind ?? '3d';
      const dy = L.phones.dy ?? 0, sc = L.phones.scale ?? 1;
      const h = Math.round((ph.height ?? 2250) * sc), x = ph.x + x0, y = (ph.y ?? 1650) + dy;
      const shadow = L.phones.shadow ?? 'soft';
      if (kind === '3d') {
        const src = `/api/phone?angle=${encodeURIComponent(ph.angle ?? 'yawp000_pitchp00')}&shot=${encodeURIComponent(ph.shot)}&roll=${ph.roll ?? 0}&glass=${L.phones.glass ?? 'soft'}`;
        return `<img class="p3d shadow-${shadow}" data-edit="ph:${ph.slot}" src="${src}" alt="" style="left:${x}px;top:${y}px;height:${h}px">`;
      }
      const w = Math.round(h * 1320 / 2868);
      const rot = ph.roll ? `rotate(${-ph.roll}deg)` : '';
      const img = `<img src="/shots/${encodeURIComponent(ph.shot)}" alt="">`;
      if (kind === 'frameless') return `<div class="pflat frameless shadow-${shadow}" data-edit="ph:${ph.slot}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:translate(-50%,-50%) ${rot}">${img}</div>`;
      return `<div class="pflat framed shadow-${shadow} ${L.phones.frame ?? 'silver'}" data-edit="ph:${ph.slot}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:translate(-50%,-50%) ${rot}">
        <div class="bezel"><div class="screen"><div class="island"></div>${img}</div></div></div>`;
    }

    function note(n, t, key) {
      const arrow = n.arrow ? `<svg class="arrow" viewBox="0 0 210 200" style="left:${n.ax ?? 0}px;top:${n.ay ?? 70}px;width:${n.aw ?? 200}px;transform:rotate(${n.arot ?? 0}deg)"><path d="${ARROWS[n.arrow]}"/></svg>` : '';
      return `<div class="note" data-edit="${key}" style="left:${n.x}px;top:${n.y}px;transform:rotate(${n.rot ?? -4}deg);color:${t.noteColor ?? t.color}">
        <span>${esc(n.text)}</span>${arrow}</div>`;
    }


    // ── Items: free-placed text and graphics per panel (listings.json → listings[id].panels.<panelId>.items[]).
    // Every item sits centred on x,y (panel px), turned by rot and grown by scale; the Edit tab drags, resizes,
    // retypes, adds and deletes them. Types: wordmark, text, note, doodle, image, crop (a cut-out of a real screenshot,
    // so floating UI is the actual app), apps, row, moons, bar, chip, phone (a 3D render, e.g. a back view), loc.
    const DOODLES = {
      'moon-stars': '<path d="M118 28 C 66 42, 52 112, 92 148 C 122 174, 164 164, 180 138 C 128 150, 92 108, 118 28 Z"/><path d="M40 40 v26 M27 53 h26 M58 120 v16 M50 128 h16 M160 40 v16 M152 48 h16"/>',
      'zzz': '<path d="M30 120 L78 120 L30 172 L80 172 M98 66 L134 66 L98 106 L136 106 M150 20 L176 20 L150 50 L178 50"/>',
      'footsteps': '<path d="M52 150 c -16 -2, -20 -30, -14 -48 c 6 -18, 26 -16, 28 2 c 2 18, -2 46, -14 46 Z M44 176 c -6 0, -8 -10, 0 -12 c 8 -2, 10 10, 0 12 Z M128 92 c -16 -2, -20 -30, -14 -48 c 6 -18, 26 -16, 28 2 c 2 18, -2 46, -14 46 Z M120 118 c -6 0, -8 -10, 0 -12 c 8 -2, 10 10, 0 12 Z"/>',
      'stairs': '<path d="M14 186 L14 150 L58 150 L58 112 L102 112 L102 74 L146 74 L146 36 L190 36"/><path d="M150 186 C 150 150, 120 140, 100 150"/><path d="M100 150 L 116 140 M100 150 L 114 162"/>',
      'sunrise': '<path d="M10 150 L190 150 M50 150 C 50 96, 150 96, 150 150 M100 70 L100 44 M44 92 L28 76 M156 92 L172 76 M20 176 L180 176"/>',
      'sparkle': '<path d="M100 14 C 106 70, 130 94, 186 100 C 130 106, 106 130, 100 186 C 94 130, 70 106, 14 100 C 70 94, 94 70, 100 14 Z"/>',
      'alarm': '<path d="M100 40 C 52 40, 28 76, 28 112 C 28 150, 60 182, 100 182 C 140 182, 172 150, 172 112 C 172 76, 148 40, 100 40 Z M100 70 L100 114 L128 130 M36 46 C 40 26, 62 16, 76 26 M164 46 C 160 26, 138 16, 124 26 M56 176 L44 194 M144 176 L156 194"/>',
      'heart': '<path d="M100 178 C 30 128, 14 96, 26 64 C 40 30, 84 30, 100 66 C 116 30, 160 30, 174 64 C 186 96, 170 128, 100 178 Z"/>',
      'bed': '<path d="M14 160 L14 70 M14 130 L190 130 L190 160 M14 104 L190 104 L190 130 M30 104 C 30 84, 66 80, 74 104"/><path d="M120 60 L144 60 L120 84 L146 84 M156 30 L172 30 L156 48 L174 48"/>',
    };
    // Generic app icons (no real logos: Guideline 2.3.9 / 5.2.1), drawn as simple glyphs on a soft gradient.
    const APPS = [
      ['#ff7a8a', '#ffb36b', '<circle cx="50" cy="52" r="17"/><rect x="24" y="26" width="52" height="52" rx="16"/><circle cx="68" cy="34" r="2.5" fill="#fff"/>'],
      ['#2f2f36', '#5b5b66', '<path d="M40 32 L70 50 L40 68 Z" fill="#fff" stroke="none"/>'],
      ['#4f7cff', '#7fb0ff', '<path d="M24 40 C 24 30, 32 26, 50 26 C 68 26, 76 30, 76 40 L76 56 C 76 66, 68 70, 54 70 L40 80 L42 70 C 30 70, 24 66, 24 56 Z"/>'],
      ['#ff5a5a', '#ff8d6b', '<path d="M30 30 L70 30 L70 70 L30 70 Z M30 44 L70 44"/><path d="M44 52 L58 60 L44 68 Z" fill="#fff" stroke="none"/>'],
      ['#7a5cff', '#b28dff', '<path d="M30 60 C 30 50, 38 46, 46 50 L46 26 L72 22 L72 56 C 72 66, 62 70, 56 64 C 50 58, 58 50, 66 52"/><circle cx="38" cy="62" r="8"/>'],
      ['#19c37d', '#7be0a8', '<path d="M24 50 C 24 34, 36 26, 50 26 C 64 26, 76 34, 76 50 C 76 66, 64 74, 50 74 C 44 74, 38 72, 34 70 L24 74 L28 64 C 25 60, 24 55, 24 50 Z"/>'],
      ['#ffb340', '#ffd86b', '<path d="M28 40 L72 40 L66 74 L34 74 Z M40 40 C 40 28, 60 28, 60 40"/>'],
      ['#3a3f58', '#6b728f', '<rect x="22" y="36" width="56" height="34" rx="16"/><path d="M36 46 v14 M29 53 h14"/><circle cx="62" cy="50" r="3" fill="#fff"/><circle cx="68" cy="58" r="3" fill="#fff"/>'],
      ['#ff4f9a', '#ff8fc0', '<path d="M50 74 C 26 56, 22 44, 28 34 C 34 24, 46 26, 50 36 C 54 26, 66 24, 72 34 C 78 44, 74 56, 50 74 Z"/>'],
      ['#1f9bff', '#73c6ff', '<rect x="24" y="28" width="52" height="44" rx="8"/><path d="M32 40 h36 M32 50 h36 M32 60 h22"/>'],
      ['#111216', '#3a3b44', '<path d="M56 24 C 56 40, 64 46, 76 46 M56 24 L56 64 C 56 74, 46 78, 38 74 C 28 68, 32 52, 46 54"/>'],
      ['#ff8a3d', '#ffc06b', '<circle cx="50" cy="50" r="22"/><path d="M50 28 L50 72 M28 50 L72 50"/>'],
    ];
    const GLYPH = {           // wake-method icons, in the app's row style
      walk: '<circle cx="54" cy="22" r="7" fill="currentColor" stroke="none"/><path d="M50 34 L44 58 L56 70 L58 88 M46 46 L34 56 M50 40 L64 52 L72 50 M44 58 L36 86"/>',
      stairs: '<path d="M18 82 L18 66 L36 66 L36 50 L54 50 L54 34 L72 34 L72 18 L86 18"/><circle cx="40" cy="22" r="6" fill="currentColor" stroke="none"/>',
      pushups: '<circle cx="80" cy="44" r="7" fill="currentColor" stroke="none"/><path d="M70 50 L22 62 M60 52 L60 74 M22 62 L14 74"/><path d="M8 78 L92 78"/>',
      scan: '<path d="M18 34 L18 18 L34 18 M66 18 L82 18 L82 34 M82 66 L82 82 L66 82 M34 82 L18 82 L18 66 M30 50 L70 50"/>',
      place: '<path d="M50 88 C 30 62, 22 50, 22 38 C 22 22, 34 12, 50 12 C 66 12, 78 22, 78 38 C 78 50, 70 62, 50 88 Z"/><circle cx="50" cy="38" r="9"/>',
    };
    function itemInner(it, t) {
      const c = it.color ?? t.color;
      switch (it.type) {
        case 'wordmark': return `<div class="wordmark" style="font-size:${it.size ?? 150}px;color:${c};font-family:${it.font ?? t.font}">
          <img src="/assets/images/icon.png" alt="">${esc(it.text ?? 'Locturne')}</div>`;
        case 'text': return `<div class="itext" style="width:${it.w ?? 1100}px;font-size:${it.size ?? 70}px;font-weight:${it.weight ?? 700};color:${c};
          font-family:${it.font ?? t.font};line-height:${it.line ?? 1.1};letter-spacing:${it.track ?? -0.02}em">${rich(it.text ?? '', t)}</div>`;
        case 'note': {
          const arrow = it.arrow ? `<svg class="arrow" viewBox="0 0 210 200" style="left:${it.ax ?? 0}px;top:${it.ay ?? 70}px;width:${it.aw ?? 200}px;transform:rotate(${it.arot ?? 0}deg)"><path d="${ARROWS[it.arrow]}"/></svg>` : '';
          return `<div class="inote" style="font-size:${it.size ?? 104}px;color:${it.color ?? t.noteColor ?? t.color}"><span>${esc(it.text)}</span>${it.underline ? `<svg class="uline" viewBox="0 0 700 34" preserveAspectRatio="none"><path d="${SWOOSH}"/></svg>` : ''}${arrow}</div>`;
        }
        case 'doodle': return `<div class="doodle" style="width:${it.w ?? 300}px;color:${it.color ?? t.noteColor ?? t.color}">
          <svg viewBox="0 0 200 200" style="stroke-width:${it.stroke ?? 5}">${DOODLES[it.kind] ?? ''}</svg>${it.label ? `<span>${esc(it.label)}</span>` : ''}</div>`;
        case 'image': return `<img class="iimg ${it.shadow ? 'shadow-' + it.shadow : ''}" src="${esc(it.src)}" alt="" style="width:${it.w ?? 400}px;border-radius:${it.radius ?? 0}px">`;
        case 'crop': {
          const [cx, cy, cw, ch] = it.crop, k = (it.w ?? cw) / cw;
          return `<div class="icrop ${it.shadow ? 'shadow-' + it.shadow : ''}" style="width:${Math.round(cw * k)}px;height:${Math.round(ch * k)}px;border-radius:${it.radius ?? 56}px;
            background:url('/shots/${encodeURIComponent(it.shot)}') ${-cx * k}px ${-cy * k}px / ${(it.sw ?? 1290) * k}px auto no-repeat ${it.bg ?? '#0a0f24'}"></div>`;
        }
        case 'apps': {
          const n = it.count ?? 12, cols = it.cols ?? 4, sz = it.size ?? 200, gap = it.gap ?? 56;
          const tiles = Array.from({ length: n }, (_, k) => {
            const [a, b, g] = APPS[k % APPS.length];
            return `<div class="app ${it.asleep === false ? '' : 'asleep'}" style="width:${sz}px;height:${sz}px;background:linear-gradient(160deg, ${a}, ${b})">
              <svg viewBox="0 0 100 100">${g}</svg>${it.asleep === false ? '' : `<i class="zz"><svg viewBox="0 0 40 40"><path d="M27 6 C 16 8, 11 20, 16 28 C 20 34, 30 35, 35 30 C 25 30, 19 18, 27 6 Z"/></svg></i>`}</div>`;
          }).join('');
          return `<div class="apps" style="grid-template-columns:repeat(${cols}, ${sz}px);gap:${gap}px">${tiles}</div>`;
        }
        case 'row': return `<div class="row ${it.style ?? 'navy'} ${it.ring ? 'ring' : ''}" style="width:${it.w ?? 1000}px;${it.ring && it.ring !== true ? `--ring:${it.ring}` : ''}">
          <span class="ricon"><svg viewBox="0 0 100 100">${GLYPH[it.icon] ?? ''}</svg></span>
          <span class="rtext"><b>${esc(it.title)}</b>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span>${it.check ? '<span class="rcheck">✓</span>' : '<span class="rdot"></span>'}</div>`;
        case 'moons': {
          const list = it.moons ?? ['moonlight', 'deepsea', 'harvest', 'full', 'twilight', 'ember', 'noir', 'blood', 'lagoon'];
          const names = { moonlight: 'Moonlight', deepsea: 'Deep Sea', harvest: 'Harvest Moon', full: 'Full Moon', twilight: 'Twilight', ember: 'Ember',
            noir: 'Noir', blood: 'Blood Moon', lagoon: 'Lagoon', prism: 'Prism', eclipse: 'Eclipse', bluehour: 'Blue Hour', lilac: 'Lilac', matcha: 'Matcha', honey: 'Honey' };
          const locked = it.locked ?? 0, sz = it.size ?? 300;
          return `<div class="moons" style="grid-template-columns:repeat(${it.cols ?? 3}, ${sz}px)">${list.map((m, k) => {
            const off = k >= list.length - locked;
            return `<div class="mtile ${off ? 'off' : ''} ${k === 0 && it.pick !== false ? 'on' : ''}" style="width:${sz}px">
              <div class="mbox" style="height:${sz}px"><img src="/assets/moons/icons/${m}.webp" alt="">${off ? '<i class="lock"></i>' : ''}</div>
              <span>${off ? '???' : esc(names[m] ?? m)}</span></div>`; }).join('')}</div>`;
        }
        case 'bar': return `<div class="bar" style="width:${it.w ?? 900}px;background:${it.track ?? 'rgba(0,0,0,.12)'}"><i style="width:${(it.value ?? 0.58) * 100}%;background:${c}"></i></div>`;
        case 'chip': return `<div class="ichip" style="font-size:${it.size ?? 44}px;background:${it.bg ?? t.color};color:${it.color ?? (L_DARK ? '#0b1020' : '#fff')}">${esc(it.text)}</div>`;
        case 'phone': return `<img class="iimg ${it.shadow ? 'shadow-' + it.shadow : 'shadow-soft'}" alt="" style="height:${it.h ?? 2000}px"
          src="/api/phone?angle=${encodeURIComponent(it.angle ?? 'yawp180_pitchp00')}&shot=${encodeURIComponent(it.shot ?? '01-asleep.png')}&roll=${it.roll ?? 0}&glass=soft">`;
        case 'loc': return `<img class="iimg" src="/loc-peek-eyes.svg" alt="" style="width:${it.w ?? 600}px">`;
      }
      return '';
    }
    let L_DARK = false;
    function itemHtml(it, key, t) {
      return `<div class="item" data-edit="${key}" style="left:${it.x ?? 660}px;top:${it.y ?? 1434}px;z-index:${it.z ?? 4};
        transform:translate(-50%,-50%) rotate(${it.rot ?? 0}deg) scale(${it.scale ?? 1})">${itemInner(it, t)}</div>`;
    }

    Promise.all([fetch('/panels.json', { cache: 'no-store' }).then((r) => r.json()),
                 fetch('/listings.json', { cache: 'no-store' }).then((r) => r.json())]).then(async ([data, lib]) => {
      const L = lib.listings.find((x) => x.id === q.get('listing')) ?? lib.listings[0];
      const byId = Object.fromEntries(data.panels.map((p) => [p.id, p]));
      // A listing may add its own panels (ids not in panels.json, e.g. a panel with no phone): their data is panels.<id>.
      const panels = (L.order ?? lib.order ?? data.panels.map((p) => p.id)).map((id) => byId[id] ?? (L.panels?.[id] ? { id } : null)).filter(Boolean);
      const n = panels.length, p = panels[i], copy = { ...(lib.copy?.[L.copy ?? 'default']?.[p.id] ?? {}), ...(L.panels?.[p.id] ?? {}) };
      const t = { ...lib.typeDefaults, ...L.type };
      const el = document.getElementById('panel');
      el.className = `panel ${L.dark ? 'dark' : ''}`;
      L_DARK = !!L.dark;
      for (const [k, v] of Object.entries({ color: t.color, accentColor: t.accentColor ?? t.color, font: t.font, emFont: t.emFont ?? t.font,
        size: `${t.size}px`, weight: t.weight, emWeight: t.emWeight, line: t.line, track: `${t.track ?? 0}em`, swoosh: t.swoosh ?? t.accentColor ?? t.color,
        marker: t.marker ?? 'transparent', subColor: t.subColor ?? t.color, kickerColor: t.kickerColor ?? t.accentColor ?? t.color }))
        el.style.setProperty(`--${k}`, v);
      if (t.case === 'upper') el.classList.add('upper');
      if (t.accent) el.classList.add(`accent-${t.accent}`);
      if (t.emItalic) el.classList.add('em-italic');

      // Phones: this slot's own, plus neighbours' phones that cross onto it.
      const pattern = typeof L.phones.pattern === 'string' ? lib.patterns[L.phones.pattern] : L.phones.pattern;
      let phones = '';
      if (L.phones.kind !== 'none') for (const k of [i - 1, i, i + 1]) {
        if (k < 0 || k >= n || L.panels?.[panels[k].id]?.phones === false) continue;   // phones: false = a panel without one
        for (const ph of phonesFor(L, pattern, panels, k)) {
          const h = (ph.height ?? 2250) * (L.phones.scale ?? 1), x = ph.x + (k - i) * W;
          if (k !== i && Math.abs(x - W / 2) > W / 2 + h * 0.6) continue;
          phones += phoneHtml(L, ph, (k - i) * W);
        }
      }

      const capBottom = t.position === 'bottom';
      const top = copy.top ?? t.top ?? 230;             // copy.top: this panel's caption, moved in the Edit tab
      const copyHtml = `<div class="copy ${capBottom ? 'bottom' : ''}" data-edit="copy:${p.id}" data-axis="y" style="${capBottom ? `bottom:${top}px` : `top:${top}px`};width:${t.width ?? 1140}px">
        ${copy.kicker ? `<p class="kicker">${esc(copy.kicker)}</p>` : ''}
        ${(copy.headline ?? p.headline) ? `<h1 class="headline">${rich(copy.headline ?? p.headline, t)}</h1>` : ''}
        ${copy.sub ? `<p class="sub">${esc(copy.sub)}</p>` : ''}</div>`;
      const loc = (L.loc && (L.loc.on ?? []).includes(p.id)) ? `<img class="loc" data-edit="loc:${p.id}" src="/loc-peek-eyes.svg" alt="" style="left:${copy.loc?.x ?? L.loc.x ?? 660}px;top:${copy.loc?.y ?? L.loc.y ?? 520}px;width:${L.loc.width ?? 520}px">` : '';
      const notes = (copy.notes ?? []).map((nn, k) => note(nn, t, `note:${p.id}:${k}`)).join('');
      const chip = copy.chip ? `<div class="chip" style="top:${copy.chip.y ?? 2560}px">${esc(copy.chip.text)}</div>` : '';
      let items = (copy.items ?? []).map((it, k) => itemHtml(it, `item:${p.id}:${k}`, t)).join('');
      // `spill: true` items cross the seams: a neighbour's are drawn here too, shifted a panel over.
      for (const k of [i - 1, i + 1]) {
        if (k < 0 || k >= n) continue;
        for (const it of L.panels?.[panels[k].id]?.items ?? [])
          // Drawn under the neighbour's own phone (z 1), so it reads as tucked behind it.
          if (it.spill) items += itemHtml({ ...it, x: (it.x ?? 660) + (k - i) * W, z: it.spillZ ?? 1 }, `spill:${panels[k].id}`, t);
      }
      el.innerHTML = background(L, n) + phones + loc + copyHtml + notes + chip + items;
      if (q.get('edit')) await new Promise((ok) => { const sc = document.createElement('script'); sc.src = '/edit-hook.js'; sc.onload = ok; document.head.appendChild(sc); });
      await document.fonts.ready;
      await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((ok) => { im.onload = im.onerror = ok; })));
      document.body.dataset.ready = '1';
    });
  </script>
</body>
</html>
