<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon renders</title>
<style>
  :root { --bg: #0b0c10; --panel: #13151b; --line: #23262f; --text: #e8ebf2; --text2: #9aa1b2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(11,12,16,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 650; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: 0; color: var(--text2); font: inherit; padding: 6px 12px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: #e8ebf2; color: #0b0c10; }
  main { max-width: 1480px; margin: 0 auto; padding: 24px 16px 80px; }
  h2 { text-align: center; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--text2); margin: 40px 0 6px; font-weight: 600; }
  p.note { text-align: center; color: var(--text2); margin: 0 auto 22px; max-width: 760px; }
  .row { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; margin-bottom: 34px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .label { font-size: 12.5px; color: var(--text2); }
  .label b { color: var(--text); font-weight: 600; }

  /* Phone mock: the moon studio's Home panel geometry (320×693, tab strip 82). */
  .phone { width: 320px; height: 693px; border-radius: 46px; background: #000; position: relative; overflow: hidden; color: #EEF6FB;
    box-shadow: 0 0 0 8px #1C1D22, 0 0 0 9px #2A2C32, 0 30px 60px rgba(0,0,0,.55); }
  .panel { position: absolute; left: 0; right: 0; top: 0; height: 611px; overflow: hidden; border-radius: 0 0 36px 36px; background: #000; }
  .sky { position: absolute; inset: 0; background: right top / cover no-repeat; transform: scaleY(-1); }
  .layer { position: absolute; background: center / contain no-repeat; pointer-events: none; }
  .tinted { -webkit-mask: center / contain no-repeat; mask: center / contain no-repeat; }
  .add { mix-blend-mode: plus-lighter; }
  .home { position: absolute; inset: 0; padding: 54px 22px 0; text-align: center; pointer-events: none; }
  .home .r { display: flex; justify-content: space-between; font-size: 13px; color: #9FB3CC; }
  .home .r b { color: #EEF6FB; font-weight: 700; letter-spacing: .02em; }
  .state { margin-top: 64px; font-size: 13px; color: #9FB3CC; letter-spacing: .04em; text-transform: uppercase; }
  .time { font-size: 76px; font-weight: 200; letter-spacing: -.03em; line-height: 1; margin-top: 10px; }
  .sub { margin-top: 12px; font-size: 15px; color: #9FB3CC; }
  .opener { position: absolute; left: 0; right: 0; top: 380px; text-align: center; pointer-events: none; }
  .opener .name { font-size: 30px; font-weight: 650; letter-spacing: -.01em; }
  .opener .line { margin-top: 8px; color: #9FB3CC; font-size: 15px; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; display: flex; justify-content: space-between; padding: 11px 18px 0; }
  .tabs { display: flex; gap: 10px; }
  .tab { width: 43px; height: 43px; border-radius: 50%; background: #1d1e22; }
  .tab.on { background: #EEF6FB; }

  /* On their own. */
  .solo { width: min(330px, 92vw); aspect-ratio: 1; background: #000; border-radius: 18px; position: relative; overflow: hidden; cursor: zoom-in; border: 1px solid var(--line); }
  .solo .layer { inset: 0; }
  .tiles { display: flex; gap: 14px; }
  .tile { width: 96px; height: 96px; border-radius: 22px; background: #05060A; border: 1px solid rgba(255,255,255,.09); display: grid; place-items: center; }
  .tile img { width: 74px; height: 74px; object-fit: contain; }
  .tile .cur { width: 96px; height: 96px; }

  /* Full-size viewer. */
  #zoom { position: fixed; inset: 0; background: #000; z-index: 50; display: none; overflow: auto; cursor: zoom-out; }
  #zoom img { display: block; margin: 0 auto; max-width: none; }
  #zoom .hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); color: #9aa1b2; font-size: 12px; background: rgba(0,0,0,.6); padding: 4px 10px; border-radius: 8px; }
  @media (max-width: 700px) { .phone { transform: scale(.82); margin: -62px -29px; } }
</style>
</head>
<body>
<header>
  <h1>Moon renders · test</h1>
  <div class="seg" id="moonSeg"></div>
  <div class="seg" id="viewSeg">
    <button data-v="home">Home</button><button data-v="opener">Opener</button>
  </div>
  <div class="seg" id="glowSeg"><button data-g="0">No glow</button><button data-g="1">Rim glow</button></div>
</header>
<main id="main"></main>
<div id="zoom"><span class="hint">Full 4096 px · click to close · scroll to pan</span><img alt=""></div>
<script>
const MOONS = {
  eclipse:  { name: 'Eclipse',      glow: '#E8A060', glowOpacity: 0.45, ring: true },
  crescent: { name: 'Crescent',     glow: '#7090D8', glowOpacity: 0.55 },
  harvest:  { name: 'Harvest Moon', glow: '#E0913C', glowOpacity: 1 },
};
const W = 320, PANEL = 611;
let moonId = 'eclipse', view = 'home', glowOn = false;
// New renders: realistic = the first take; soft / porcelain = the app-style takes (render.py --style).
const file = (kind, id) => (kind === 'real' ? id : `${id}-${kind}`);
{ const h = location.hash.slice(1).split('&'); if (h[0] in { eclipse: 1, crescent: 1, harvest: 1 }) moonId = h[0]; if (h[1] === 'opener') view = 'opener'; }
const v = '?v=' + Date.now();

// Where the disc sits: Home = rising from the bottom, 36% showing (night-sky.tsx risingMoon);
// Opener = heroMoon, centred up top.
function disc() {
  if (view === 'home') { const s = W * 0.9; return { cx: W / 2, cy: PANEL - s * 0.36 + s / 2, s }; }
  const s = Math.min(W * 0.66, 693 * 0.32); return { cx: W / 2, cy: 693 * 0.34, s };
}
const box = (size, d) => `width:${size}px;height:${size}px;left:${d.cx - size / 2}px;top:${d.cy - size / 2}px`;

// kind: current | new | glow
function moonLayers(kind, d, id) {
  const m = MOONS[id];
  if (kind === 'current') {
    return `<div class="layer tinted" style="${box(d.s * 2, d)};background:${m.glow};opacity:${m.glowOpacity};-webkit-mask-image:url(/assets/onboarding/moon-glow.png);mask-image:url(/assets/onboarding/moon-glow.png)"></div>
      <div class="layer" style="${box(d.s * 1.5, d)};background-image:url(/assets/moons/${id}-moon.webp)"></div>
      ${m.ring ? `<div class="layer" style="${box(d.s * 1.6, d)};background-image:url(/assets/moons/${id}-ring.webp)"></div>` : ''}`;
  }
  const f = file(kind, id);
  const moon = `<div class="layer" style="${box(d.s / 0.8, d)};background-image:url(out/web/${f}-1440.webp${v})"></div>`;
  if (!glowOn) return moon;
  return moon + `<div class="layer add" style="${box(d.s * 2, d)};background-image:url(out/web/${f}-glow.webp${v})"></div>`;
}

function phone(kind, id) {
  const d = disc();
  const ui = view === 'home'
    ? `<div class="home"><div class="r"><b>Locturne</b><span>Sat, Nov 7</span></div><div class="state">Apps asleep</div><div class="time">11:42</div><div class="sub">Awake after 200 steps from 7:00</div></div>`
    : `<div class="opener"><div class="name">${MOONS[id].name}</div><div class="line">New moon unlocked</div></div>`;
  return `<div class="phone"><div class="panel"><div class="sky" style="background-image:url(/assets/moons/${id}-sky.webp)"></div>${moonLayers(kind, d, id)}${ui}</div>
    <div class="strip"><div class="tabs"><div class="tab on"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div></div><div class="tab"></div></div></div>`;
}

function solo(kind, id) {
  // Current images are 1.5× the disc (frost padding), the ring 1.6×; the new renders' disc is 0.8 of the image.
  if (kind === 'current') return `<div class="solo" data-full="/assets/moons/${id}-moon.webp">
      <div class="layer" style="inset:-10%;background-image:url(/assets/moons/${id}-moon.webp)"></div>
      ${MOONS[id].ring ? `<div class="layer" style="inset:-14%;background-image:url(/assets/moons/${id}-ring.webp)"></div>` : ''}</div>`;
  const f = file(kind, id);
  const glow = glowOn ? `<div class="layer add" style="inset:-25%;background-image:url(out/web/${f}-glow.webp${v})"></div>` : '';
  return `<div class="solo" data-full="out/web/${f}-4k.webp${v}"><div class="layer" style="background-image:url(out/web/${f}-1440.webp${v})"></div>${glow}</div>`;
}

const COLS = [['current', 'Current', 'today’s moon + halo'], ['real', 'Realistic', 'first render'], ['soft', 'Soft', 'calm surface, app colours'], ['porcelain', 'Porcelain', 'soft + satin coat']];
function render() {
  const id = moonId;
  const cols = (f) => COLS.map(([k, t, s]) => `<div class="col">${f(k, id)}<div class="label"><b>${t}</b> · ${s}</div></div>`).join('');
  document.getElementById('main').innerHTML = `
    <h2>In the app</h2>
    <p class="note">The moon studio’s Home mock: same sky, same moon size and position as the app. Current uses today’s halo (moon-glow.png tinted ${MOONS[id].glow}).</p>
    <div class="row">${cols(phone)}</div>
    <h2>On their own</h2>
    <p class="note">Same disc size for all four. Click any one to see it full size (the new ones are 4096 px).</p>
    <div class="row">${cols(solo)}</div>
    <h2>Collection tile size</h2>
    <div class="row"><div class="col"><div class="tiles">
      ${Object.keys(MOONS).map((k) => `<div class="tile"><div class="layer cur" style="position:static;background-image:url(/assets/moons/${k}-moon.webp)"></div></div>`).join('')}
    </div><div class="label"><b>Current</b></div></div>
    ${COLS.slice(1).map(([kind, t]) => `<div class="col"><div class="tiles">
      ${Object.keys(MOONS).map((k) => `<div class="tile"><img src="out/web/${file(kind, k)}-1440.webp${v}" alt=""></div>`).join('')}
    </div><div class="label"><b>${t}</b></div></div>`).join('')}</div>`;
  document.querySelectorAll('.solo').forEach((el) => el.onclick = () => {
    const z = document.getElementById('zoom'); z.querySelector('img').src = el.dataset.full; z.style.display = 'block';
  });
}
document.getElementById('zoom').onclick = (e) => { e.currentTarget.style.display = 'none'; };
const ms = document.getElementById('moonSeg');
ms.innerHTML = Object.entries(MOONS).map(([k, m]) => `<button data-m="${k}" class="${k === moonId ? 'on' : ''}">${m.name}</button>`).join('');
ms.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; moonId = b.dataset.m; ms.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); render(); };
const vs = document.getElementById('viewSeg');
vs.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; vs.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); render(); };
vs.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.v === view));
const gs = document.getElementById('glowSeg');
const gsOn = () => gs.querySelectorAll('button').forEach((x) => x.classList.toggle('on', (x.dataset.g === '1') === glowOn));
gs.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; glowOn = b.dataset.g === '1'; gsOn(); render(); };
gsOn();
render();
</script>
</body>
</html>
