<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* The app's Midnight palette (src/theme/colors.ts). No glow anywhere: neutral drop shadows only. */
  :root {
    --bg: #060B18; --surface: #0F1A33; --raised: #172444;
    --text: #EEF6FB; --text2: #9FB3CC; --text3: #7C90AE;
    --edge: rgba(221,240,248,0.16); --line: rgba(221,240,248,0.08);
    --glass: rgba(23,36,68,0.72); --moonwhite: #DDE9F2; --navy-ink: #0B1428;
    --sans: 'SF Pro Display', -apple-system, Inter, system-ui, sans-serif;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #101114; color: #ddd; font-family: var(--sans); padding: 32px 24px 80px; }
  header { max-width: 1480px; margin: 0 auto 28px; display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  header div { flex: 1; min-width: 280px; }
  header h1 { font-size: 22px; font-weight: 600; color: #fff; }
  header p { color: #9a9ca3; font-size: 14px; margin-top: 6px; max-width: 760px; line-height: 1.5; }
  button.all { background: #EEF6FB; color: #0B1428; border: 0; border-radius: 20px; height: 40px; padding: 0 18px; font: 600 14px var(--sans); cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 36px 28px; max-width: 1480px; margin: 0 auto; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  figcaption { width: 340px; }
  figcaption b { color: #fff; font-size: 14px; font-weight: 600; }
  figcaption b span { color: #6f7279; font-weight: 500; margin-right: 6px; }
  figcaption p { color: #9a9ca3; font-size: 12.5px; line-height: 1.45; margin-top: 4px; }

  /* ——— The scene: the foot of the payoff's sky panel, Loc peeking over its edge. ——— */
  .stage { width: 340px; height: 290px; position: relative; overflow: hidden; border-radius: 0 0 36px 36px; cursor: pointer;
    background: linear-gradient(180deg, #0A1330 0%, #16264F 55%, #22366A 100%); color: var(--text); }
  .stage::after { content: '↻ replay'; position: absolute; right: 14px; top: 12px; font-size: 11px; color: var(--text3); opacity: 0; transition: opacity .2s; }
  .stage:hover::after { opacity: 1; }
  .loc { position: absolute; left: 50%; bottom: -2px; width: 132px; margin-left: -66px; z-index: 3; }
  .loc img { width: 100%; display: block; }
  /* Centring lives on the anchor, so every bubble is free to animate its own transform. */
  .anchor { position: absolute; left: 0; right: 0; bottom: 104px; display: flex; justify-content: center; z-index: 2; pointer-events: none; }
  .b { position: relative; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--edge); color: var(--text); font-weight: 600; font-size: 16px; line-height: 20px;
    padding: 12px 18px; border-radius: 22px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .mono { font-family: var(--mono); }
  .dim { color: var(--text2); }

  /* Loc's own small moves, shared. */
  @keyframes hop { 0%,100% { transform: translateY(0) } 30% { transform: translateY(-10px) } 55% { transform: translateY(0) } 70% { transform: translateY(-3px) } }
  @keyframes duck { 0%,100% { transform: translateY(0) } 25% { transform: translateY(14px) } 60% { transform: translateY(-4px) } }
  @keyframes tremble { 0%,100% { transform: translate(0,0) } 20% { transform: translate(-1.5px,1px) } 40% { transform: translate(1.5px,-1px) } 60% { transform: translate(-1px,-1px) } 80% { transform: translate(1px,1px) } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 15% { transform: translateX(-7px) rotate(-2deg) } 30% { transform: translateX(6px) rotate(2deg) } 45% { transform: translateX(-4px) rotate(-1deg) } 60% { transform: translateX(3px) } 75% { transform: translateX(-1px) } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .loc.hop { animation: hop .7s var(--out) both; }
  .loc.duck { animation: duck .8s var(--out) both; }
</style>
<style id="variant-css"></style>
</head>
<body>
<header>
  <div>
    <h1>Bubble lab: Loc's payoff line</h1>
    <p>Twenty takes on the bubble Loc says on the morning payoff, each with its own entrance. Every one uses the app's world:
      the sleep mask, the moon, the shield, Gerald, his files, the night coming back. Click a scene to replay it.
      Navy glass and moon white only, no glow.</p>
  </div>
  <button class="all" onclick="playAll()">Replay all</button>
</header>
<div class="grid" id="grid"></div>

<script>
const LOC = '<img src="/loc/loc-peek-eyes.svg" alt="">';

// Seconds until 22:30 tonight (or tomorrow if that's passed), for the doom countdown.
function untilBedtime() {
  const now = new Date(), bed = new Date(now);
  bed.setHours(22, 30, 0, 0);
  if (bed <= now) bed.setDate(bed.getDate() + 1);
  return Math.floor((bed - now) / 1000);
}
const hms = (s) => [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n) => String(n).padStart(2, '0')).join(':');

// Each letter its own span, for per-letter motion. `i` is passed to CSS as --i.
const letters = (text, cls = 'ch') =>
  [...text].map((c, i) => `<span class="${cls}" style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
const words = (text, cls = 'w') => text.split(' ').map((w, i) => `<span class="${cls}" style="--i:${i}">${w}</span>`).join(' ');

const V = [
  {
    name: 'Changed his mind',
    note: 'He starts to say something nice, scribbles it out by hand, and writes the truth. The correction is the joke.',
    loc: 'hop',
    css: `
      .v1 .b { animation: v1in .5s var(--spring) both; }
      @keyframes v1in { from { opacity: 0; transform: scale(.6) translateY(10px) } to { opacity: 1; transform: none } }
      .v1 .kind { position: relative; display: inline-block; color: var(--text2); }
      .v1 .kind svg { position: absolute; left: -4px; top: -2px; width: calc(100% + 8px); height: 24px; overflow: visible; }
      .v1 .kind path { fill: none; stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 220; stroke-dashoffset: 220; animation: v1draw .5s ease-in-out .9s forwards; }
      @keyframes v1draw { to { stroke-dashoffset: 0 } }
      .v1 .truth { display: inline-block; max-width: 0; overflow: hidden; vertical-align: bottom; opacity: 0;
        animation: v1truth .45s var(--out) 1.45s forwards; }
      @keyframes v1truth { to { max-width: 90px; opacity: 1 } }`,
    html: () => `<div class="b">You did it. I’m <span class="kind">proud<svg viewBox="0 0 60 24" preserveAspectRatio="none"><path d="M2 14 L10 6 L16 17 L24 5 L31 18 L39 5 L46 17 L53 6 L58 14"/></svg></span> <span class="truth">furious.</span></div>`,
  },
  {
    name: 'Mask up',
    note: 'The bubble arrives wearing his sleep mask. He shoves it up and off like he just woke, and the words are under it.',
    css: `
      .v2 .b { animation: fade .25s both; overflow: visible; }
      .v2 .words { opacity: 0; animation: fade .3s ease .75s forwards; }
      .v2 .mask { position: absolute; inset: -1px; border-radius: 22px; background: #0B1428; border: 1px solid var(--edge);
        display: flex; align-items: center; justify-content: center; gap: 26px; transform-origin: 50% 0;
        animation: v2lift .7s cubic-bezier(.5,0,.3,1) .55s forwards; }
      .v2 .mask::before, .v2 .mask::after { content: ''; position: absolute; top: 50%; height: 3px; width: 34px; background: #0B1428; border-radius: 2px; }
      .v2 .mask::before { right: 100%; } .v2 .mask::after { left: 100%; }
      .v2 .mask svg { width: 30px; height: 12px; }
      .v2 .mask path { fill: none; stroke: var(--text3); stroke-width: 2; stroke-linecap: round; }
      @keyframes v2lift { 0% { transform: none } 30% { transform: translateY(4px) } 100% { transform: translateY(-58px) rotate(-14deg) scale(.8); opacity: 0 } }`,
    html: () => `<div class="b"><span class="words">Ugh. Morning. You won.</span><div class="mask">
      <svg viewBox="0 0 30 12"><path d="M2 3 Q15 14 28 3"/></svg><svg viewBox="0 0 30 12"><path d="M2 3 Q15 14 28 3"/></svg></div></div>`,
  },
  {
    name: 'Eclipse ends',
    note: 'A moon-white bubble, uncovered by a dark disc sliding off it like the end of an eclipse. The only light bubble here, for the payoff only.',
    css: `
      .v3 .b { background: var(--moonwhite); color: var(--navy-ink); border-color: transparent; overflow: hidden; animation: v3in .35s var(--out) both; }
      @keyframes v3in { from { opacity: 0; transform: scale(.85) } to { opacity: 1; transform: none } }
      .v3 .disc { position: absolute; top: 50%; left: 50%; width: 320px; height: 320px; margin: -160px 0 0 -160px; border-radius: 50%;
        background: #0B1428; animation: v3slide 1.1s cubic-bezier(.6,0,.25,1) .35s forwards; }
      @keyframes v3slide { to { transform: translateX(460px) } }`,
    html: () => `<div class="b">The moon is up. So are you. Gross.<div class="disc"></div></div>`,
  },
  {
    name: 'Burrow pop',
    note: 'The bubble bursts up from behind his head like one of his burrows, overshoots and lands with a squash. Loc ducks as it leaves.',
    loc: 'duck',
    css: `
      .v4 .anchor { z-index: 2; }
      .v4 .b { transform-origin: 50% 100%; animation: v4pop .9s both; }
      @keyframes v4pop {
        0% { transform: translateY(110px) scale(.3, .5); opacity: 0 }
        25% { opacity: 1 }
        45% { transform: translateY(-22px) scale(.92, 1.12) }
        65% { transform: translateY(0) scale(1.12, .84) }
        80% { transform: scale(.97, 1.04) }
        100% { transform: none } }`,
    html: () => `<div class="b">BURST OUT OF BED?? Respect.</div>`,
  },
  {
    name: 'Shield, unlocked',
    note: 'The shield the user saw all night, shrunk to a card. The shackle pops open and the title flips from asleep to awake.',
    css: `
      .v5 .b { display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; border-radius: 20px; animation: v1in .5s var(--spring) both; }
      @keyframes v1in { from { opacity: 0; transform: scale(.6) translateY(10px) } to { opacity: 1; transform: none } }
      .v5 .ico { width: 38px; height: 38px; border-radius: 11px; background: rgba(221,240,248,0.1); display: flex; align-items: center; justify-content: center; }
      .v5 .shackle { transform-origin: 18px 12px; animation: v5open .45s var(--spring) .8s forwards; }
      @keyframes v5open { to { transform: translateY(-4px) rotate(-28deg) } }
      .v5 .ico svg { animation: v5jolt .35s ease .8s; }
      @keyframes v5jolt { 40% { transform: scale(1.15) } }
      .v5 .t { display: grid; }
      .v5 .t > * { grid-area: 1 / 1; }
      .v5 .t1 { animation: v5out .25s ease .85s forwards; }
      .v5 .t2 { opacity: 0; animation: fadeUp .35s var(--out) 1s forwards; }
      @keyframes v5out { to { opacity: 0; transform: translateY(-6px) } }
      .v5 .s { font-size: 13px; font-weight: 500; color: var(--text2); line-height: 17px; opacity: 0; animation: fade .3s ease 1.25s forwards; }`,
    html: () => `<div class="b"><div class="ico"><svg width="22" height="26" viewBox="0 0 22 26">
      <path class="shackle" d="M5 12 V8 a6 6 0 0 1 12 0 V12" fill="none" stroke="#EEF6FB" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="2" y="11" width="18" height="13" rx="3.5" fill="#EEF6FB"/></svg></div>
      <div><div class="t"><span class="t1">Apps asleep</span><span class="t2">Apps awake</span></div>
      <div class="s">Against my wishes.</div></div></div>`,
  },
  {
    name: 'Filed',
    note: 'His case file on you. The bubble lands as an index card, then a NOTED stamp thuds onto it and shakes it.',
    css: `
      .v6 .b { padding: 10px 16px 12px; border-radius: 14px; animation: v6in .45s var(--out) both, v6thud .3s ease 1s; }
      @keyframes v6in { from { opacity: 0; transform: translateY(16px) rotate(-3deg) } to { opacity: 1; transform: rotate(-1deg) } }
      @keyframes v6thud { 0% { transform: rotate(-1deg) } 35% { transform: translateY(3px) rotate(-2deg) scale(.98) } 100% { transform: rotate(-1deg) } }
      .v6 .lab { font: 700 10px/14px var(--mono); letter-spacing: .14em; color: var(--text3); }
      .v6 .stamp { position: absolute; right: -14px; top: -14px; font: 700 13px/1 var(--mono); letter-spacing: .14em; color: var(--text);
        border: 2px solid var(--text); border-radius: 6px; padding: 5px 7px; background: rgba(11,20,40,0.9);
        opacity: 0; animation: v6stamp .3s cubic-bezier(.5,0,.75,0) .75s forwards; }
      @keyframes v6stamp { from { opacity: 0; transform: scale(2.4) rotate(-4deg) } to { opacity: 1; transform: scale(1) rotate(12deg) } }`,
    html: () => `<div class="b"><div class="lab">LOC’S FILES · MORNING 12</div>Subject got up. Again. Suspicious.<div class="stamp">NOTED</div></div>`,
  },
  {
    name: 'Mumble, then the yell',
    note: 'A tiny grey mumble first. Then it bursts into the full line in heavy caps and shakes. Matches his yell on the payoff.',
    loc: 'hop',
    css: `
      .v7 .b { transform-origin: 50% 100%; animation: v7grow .5s var(--spring) .9s both, shake .45s ease 1.25s; }
      @keyframes v7grow { from { transform: scale(.62) } to { transform: none } }
      .v7 .b { display: grid; }
      .v7 .b > * { grid-area: 1 / 1; text-align: center; }
      .v7 .m { font-weight: 500; font-style: italic; color: var(--text2); animation: fade .3s ease both, v5out .15s ease .9s forwards; }
      .v7 .y { font-weight: 900; font-size: 19px; letter-spacing: .01em; opacity: 0; animation: fade .1s ease .9s forwards; }
      @keyframes v5out { to { opacity: 0 } }`,
    html: () => `<div class="b"><span class="m">you did it…</span><span class="y">AND I’M FURIOUS.</span></div>`,
  },
  {
    name: 'Chattering',
    note: 'Letters drop in one at a time and keep chattering for a beat, like his teeth. Raccoons actually chatter.',
    css: `
      .v8 .b { animation: v1in .35s var(--out) both; }
      @keyframes v1in { from { opacity: 0; transform: scale(.85) } to { opacity: 1; transform: none } }
      .v8 .ch { display: inline-block; opacity: 0; animation: v8drop .3s var(--spring) calc(.25s + var(--i) * 28ms) forwards, tremble .12s linear calc(1.2s + var(--i) * 7ms) 6; }
      @keyframes v8drop { from { opacity: 0; transform: translateY(-12px) rotate(-14deg) } to { opacity: 1; transform: none } }`,
    html: () => `<div class="b">${letters('Up?? At SEVEN?? Disgusting.')}</div>`,
  },
  {
    name: 'Rolling time',
    note: 'The wake-up time rolls in on reels like a clock that’s also annoyed, then he gives it a one-word review.',
    css: `
      .v9 .b { display: flex; align-items: center; gap: 2px; animation: v1in .4s var(--out) both; }
      @keyframes v1in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .v9 .reel { display: inline-block; height: 22px; overflow: hidden; font-weight: 800; font-size: 19px; line-height: 22px; font-variant-numeric: tabular-nums; }
      .v9 .reel span { display: block; animation: v9roll var(--d) cubic-bezier(.2,.8,.25,1) .2s both; }
      @keyframes v9roll { from { transform: translateY(0) } to { transform: translateY(var(--to)) } }
      .v9 .colon { font-weight: 800; font-size: 19px; }
      .v9 .am { font-size: 13px; color: var(--text2); margin: 0 10px 0 3px; }
      .v9 .rev { opacity: 0; animation: v9rev .4s var(--spring) 1.5s forwards; }
      @keyframes v9rev { from { opacity: 0; transform: scale(1.6) } to { opacity: 1; transform: none } }`,
    html: () => {
      // Each reel spins through a few loops of 0–9 and stops on its digit.
      const reel = (digit, loops, d) => {
        const n = loops * 10 + digit;
        const nums = Array.from({ length: n + 1 }, (_, k) => `<i style="display:block;font-style:normal">${k % 10}</i>`).join('');
        return `<span class="reel"><span style="--to:-${n * 22}px;--d:${d}s">${nums}</span></span>`;
      };
      return `<div class="b">${reel(7, 1, 0.9)}<span class="colon">:</span>${reel(0, 2, 1.1)}${reel(6, 3, 1.3)}<span class="am">am</span><span class="rev">Rude.</span></div>`;
    },
  },
  {
    name: 'Zzz into words',
    note: 'Three z’s float up off his head, the last one swells into the bubble. He was asleep. You woke him.',
    css: `
      .v10 .z { position: absolute; left: 50%; bottom: 0; font-weight: 800; color: var(--text2); opacity: 0;
        animation: v10z 1s ease-out var(--d) forwards; }
      @keyframes v10z { 0% { opacity: 0; transform: translate(0, 10px) scale(.6) } 30% { opacity: 1 }
        100% { opacity: 0; transform: translate(var(--x), -46px) scale(1.1) rotate(-12deg) } }
      .v10 .b { animation: v10in .55s var(--spring) .95s both; transform-origin: 60% 100%; }
      @keyframes v10in { from { opacity: 0; transform: scale(.08) translate(40px, 30px) } to { opacity: 1; transform: none } }`,
    html: () => `<span class="z" style="--d:0s;--x:14px;font-size:13px">z</span><span class="z" style="--d:.25s;--x:-8px;font-size:17px">z</span><span class="z" style="--d:.5s;--x:20px;font-size:22px">Z</span>
      <div class="b">I was asleep. YOU woke ME.</div>`,
  },
  {
    name: 'Hung on a nail',
    note: 'The bubble swings down from a pin by his ear and wobbles to rest, like a sign he hung up himself.',
    css: `
      .v11 .b { transform-origin: 14px 50%; animation: v11swing 1.3s both; }
      @keyframes v11swing { 0% { transform: rotate(-80deg); opacity: 0 } 12% { opacity: 1 } 35% { transform: rotate(9deg) }
        55% { transform: rotate(-5deg) } 72% { transform: rotate(2.5deg) } 86% { transform: rotate(-1deg) } 100% { transform: none } }
      .v11 .pin { position: absolute; left: 9px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--text3); }
      .v11 .b { padding-left: 26px; }`,
    html: () => `<div class="b"><span class="pin"></span>Fine. The apps can have you.</div>`,
  },
  {
    name: 'Closed for doom',
    note: 'A shop sign drops in on two strings from the top of the sky and swings. Doom is closed for the day, back tonight.',
    css: `
      .v12 .anchor { bottom: 96px; }
      .v12 .sign { position: relative; transform-origin: 50% -200px; animation: v12drop 1.5s both; }
      @keyframes v12drop { 0% { transform: translateY(-260px) } 35% { transform: translateY(8px) rotate(3deg) }
        52% { transform: translateY(-2px) rotate(-2.5deg) } 70% { transform: rotate(1.4deg) } 85% { transform: rotate(-.6deg) } 100% { transform: none } }
      .v12 .str { position: absolute; bottom: 100%; width: 1px; height: 220px; background: rgba(221,240,248,0.35); }
      .v12 .b { text-align: center; padding: 10px 18px; border-radius: 12px; }
      .v12 .big { font-weight: 900; letter-spacing: .08em; font-size: 15px; }
      .v12 .small { font-size: 12.5px; font-weight: 500; color: var(--text2); }`,
    html: () => `<div class="sign"><span class="str" style="left:22px"></span><span class="str" style="right:22px"></span>
      <div class="b"><div class="big">CLOSED FOR DOOM</div><div class="small">Reopening 10:30 pm</div></div></div>`,
  },
  {
    name: 'Receipt',
    note: 'A receipt prints up out of his head for the morning. Mono type, a torn top edge, line by line.',
    css: `
      .v13 .anchor { bottom: 96px; }
      .v13 .b { font: 500 12.5px/18px var(--mono); padding: 12px 16px 10px; border-radius: 4px 4px 14px 14px; width: 220px; white-space: normal;
        clip-path: inset(100% 0 0 0); animation: v13print 1.1s steps(9, end) .15s forwards; }
      @keyframes v13print { to { clip-path: inset(-12px 0 0 0) } }
      .v13 .b::before { content: ''; position: absolute; left: -1px; right: -1px; top: -7px; height: 8px;
        background: linear-gradient(135deg, transparent 50%, var(--glass) 50%) 0 0 / 10px 8px, linear-gradient(225deg, transparent 50%, var(--glass) 50%) 0 0 / 10px 8px; }
      .v13 .r { display: flex; justify-content: space-between; }
      .v13 .tot { border-top: 1px dashed var(--edge); margin-top: 6px; padding-top: 6px; font-weight: 700; color: var(--text); }
      .v13 .dim { color: var(--text2); }`,
    html: () => `<div class="b"><div class="r"><span>MORNING</span><span>#12</span></div>
      <div class="r dim"><span>apps eaten</span><span>0</span></div><div class="r dim"><span>pigeons shook</span><span>4</span></div>
      <div class="r dim"><span>my dignity</span><span>-1</span></div><div class="r tot"><span>NO REFUNDS</span><span>:(</span></div></div>`,
  },
  {
    name: 'Gerald replies',
    note: 'Loc says it, then a second, smaller bubble slides in from off-screen. Gerald is never seen. Running lore from Home.',
    css: `
      .v14 .anchor { flex-direction: column; align-items: center; gap: 8px; bottom: 100px; }
      .v14 .b1 { animation: v1in .45s var(--spring) both; order: 2; }
      @keyframes v1in { from { opacity: 0; transform: scale(.6) translateY(10px) } to { opacity: 1; transform: none } }
      .v14 .b2 { order: 1; align-self: flex-end; margin-right: 18px; font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: 16px;
        background: rgba(15,26,51,0.8); color: var(--text2); opacity: 0; animation: v14in .5s var(--out) 1.1s forwards; }
      .v14 .b2 b { font: 700 9.5px var(--mono); letter-spacing: .14em; color: var(--text3); display: block; margin-bottom: 1px; }
      @keyframes v14in { from { opacity: 0; transform: translateX(120px) } to { opacity: 1; transform: none } }`,
    html: () => `<div class="b b1">You got up. Gerald, write that down.</div><div class="b b2"><b>GERALD</b>…noted.</div>`,
  },
  {
    name: 'Declassified',
    note: 'Most of the line is under a redaction bar. The bar wipes off to show how he really feels.',
    css: `
      .v15 .b { animation: v1in .4s var(--out) both; }
      @keyframes v1in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .v15 .red { position: relative; display: inline-block; }
      .v15 .red::after { content: ''; position: absolute; inset: 1px -3px; background: #000; border-radius: 3px; transform-origin: 100% 50%;
        animation: v15wipe .55s cubic-bezier(.7,0,.3,1) 1s forwards; }
      @keyframes v15wipe { to { transform: scaleX(0) } }
      .v15 .lab { position: absolute; left: 14px; top: -9px; font: 700 9.5px/1 var(--mono); letter-spacing: .16em; color: var(--text3);
        background: #0B1428; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--edge); }`,
    html: () => `<div class="b"><span class="lab">CLASSIFIED</span>You did it. I’m <span class="red">devastated.</span></div>`,
  },
  {
    name: 'Doom countdown',
    note: 'He’s already counting down to bedtime, live, to the second. The morning is won, the night is coming back for you.',
    css: `
      .v16 .b { text-align: center; padding: 10px 18px 12px; animation: v1in .5s var(--spring) both; }
      @keyframes v1in { from { opacity: 0; transform: scale(.7) } to { opacity: 1; transform: none } }
      .v16 .top { font-size: 13px; font-weight: 500; color: var(--text2); }
      .v16 .clock { font: 700 22px/26px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: .02em; opacity: 0; animation: fadeUp .4s var(--out) .45s forwards; }
      .v16 .clock .s { display: inline-block; }
      .v16 .clock .s.tick { animation: v16tick .25s var(--out); }
      @keyframes v16tick { from { transform: translateY(-6px); opacity: .3 } to { transform: none; opacity: 1 } }`,
    html: () => `<div class="b"><div class="top">Enjoy it. Doom returns in</div><div class="clock" data-countdown></div></div>`,
    after: (el) => {
      const clock = el.querySelector('[data-countdown]');
      const draw = () => {
        const [h, m, s] = hms(untilBedtime()).split(':');
        clock.innerHTML = `${h}:${m}:<span class="s tick">${s}</span>`;
      };
      draw();
      return setInterval(draw, 1000);
    },
  },
  {
    name: 'Eyelid',
    note: 'The bubble opens like an eye, top and bottom lids parting, while Loc blinks along. He saw you get up.',
    css: `
      .v17 .b { clip-path: ellipse(55% 0% at 50% 50%); animation: v17open .6s cubic-bezier(.3,0,.2,1) .35s forwards; }
      @keyframes v17open { 0% { clip-path: ellipse(55% 0% at 50% 50%) } 60% { clip-path: ellipse(70% 46% at 50% 50%) } 70% { clip-path: ellipse(70% 30% at 50% 50%) } 100% { clip-path: ellipse(90% 140% at 50% 50%) } }
      .v17 .loc { animation: v17blink .6s ease .2s; }
      @keyframes v17blink { 40% { clip-path: inset(0 0 18% 0) } }`,
    html: () => `<div class="b">I saw that. Out of bed. Disgusting.</div>`,
  },
  {
    name: 'Heavy words',
    note: 'Words fall onto the bubble one by one. The last one is so heavy the whole bubble dips under it.',
    css: `
      .v18 .b { transform-origin: 50% 0; animation: v1in .3s var(--out) both, v18dip .5s var(--out) 1.15s; }
      @keyframes v1in { from { opacity: 0; transform: scaleX(.6) } to { opacity: 1; transform: none } }
      @keyframes v18dip { 30% { transform: translateY(9px) scale(1.04, .9) } 60% { transform: translateY(-2px) } 100% { transform: none } }
      .v18 .w { display: inline-block; opacity: 0; animation: v18fall .35s cubic-bezier(.5,0,.8,.4) calc(.3s + var(--i) * .25s) forwards, v18land .25s var(--out) calc(.65s + var(--i) * .25s); }
      .v18 .w:last-child { font-weight: 900; }
      @keyframes v18fall { from { opacity: 0; transform: translateY(-60px) } to { opacity: 1; transform: none } }
      @keyframes v18land { 40% { transform: scale(1.1, .82) } }`,
    html: () => `<div class="b">${words('Morning. Beaten. AGAIN.')}</div>`,
  },
  {
    name: 'Moon dot',
    note: 'A tiny moon-white dot hops off his head on an arc and stretches into the capsule, then darkens to glass. The moon rose for you.',
    css: `
      .v19 .b { animation: v19morph .8s var(--out) .55s both; overflow: hidden; }
      @keyframes v19morph { 0% { max-width: 14px; height: 14px; padding: 0; background: var(--moonwhite); border-radius: 7px; color: transparent }
        45% { max-width: 320px; height: 44px; padding: 12px 18px; background: var(--moonwhite); border-radius: 22px; color: transparent }
        100% { max-width: 320px; height: 44px; padding: 12px 18px; background: var(--glass); color: var(--text) } }
      .v19 .arc { animation: v19arc .55s cubic-bezier(.3,.6,.4,1) both; }
      @keyframes v19arc { 0% { transform: translate(-30px, 90px) scale(.6); opacity: 0 } 20% { opacity: 1 } 60% { transform: translate(-10px, -26px) } 100% { transform: none } }`,
    html: () => `<div class="arc"><div class="b">You raised the moon. Show-off.</div></div>`,
  },
  {
    name: 'Tally on the wall',
    note: 'He keeps count like a prisoner. The marks draw in, the newest one slower, then the gate stroke slashes the five.',
    css: `
      .v20 .b { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 18px; animation: v1in .4s var(--out) both; }
      @keyframes v1in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .v20 svg { height: 26px; overflow: visible; }
      .v20 path { fill: none; stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 40; stroke-dashoffset: 40;
        animation: v20draw var(--l, .12s) ease-out var(--d) forwards; }
      .v20 path.old { stroke: var(--text3); }
      @keyframes v20draw { to { stroke-dashoffset: 0 } }
      .v20 .line { font-size: 15px; opacity: 0; animation: fadeUp .35s var(--out) 1.9s forwards; }`,
    html: () => {
      // Twelve mornings: two gated fives, then two singles; the last stroke is today's.
      let p = '', x = 0, d = 0.3;
      const mark = (cls, path, l = 0.12) => { p += `<path class="${cls}" d="${path}" style="--d:${d.toFixed(2)}s;--l:${l}s"/>`; d += l + 0.04; };
      for (let g = 0; g < 2; g++) {
        for (let k = 0; k < 4; k++) mark('old', `M${x + k * 7} 2 V24`);
        mark('old', `M${x - 3} 20 L${x + 24} 6`);
        x += 38;
      }
      mark('old', `M${x} 2 V24`);
      d += 0.25;
      mark('', `M${x + 7} 2 V24`, 0.45);
      return `<div class="b"><svg viewBox="-4 0 ${x + 14} 26" width="${x + 18}">${p}</svg><span class="line">Twelve. I’m running out of wall.</span></div>`;
    },
  },
];

// Keyframes are global, so the shared names (v1in, v5out) get each variant's own number.
document.getElementById('variant-css').textContent = V.map((v, i) => v.css.replace(/\bv(1in|5out)\b/g, (_, k) => `v${i + 1}${k.slice(1)}`)).join('\n');

const grid = document.getElementById('grid');
const timers = new Map();

function play(i) {
  const v = V[i];
  const stage = grid.children[i].querySelector('.stage');
  clearInterval(timers.get(i));
  stage.innerHTML = `<div class="anchor">${v.html()}</div><div class="loc ${v.loc ?? ''}">${LOC}</div>`;
  if (v.after) timers.set(i, v.after(stage));
}

function playAll() { V.forEach((_, i) => play(i)); }

V.forEach((v, i) => {
  const fig = document.createElement('figure');
  fig.innerHTML = `<div class="stage v${i + 1}"></div><figcaption><b><span>${String(i + 1).padStart(2, '0')}</span>${v.name}</b><p>${v.note}</p></figcaption>`;
  fig.querySelector('.stage').addEventListener('click', () => play(i));
  grid.appendChild(fig);
});
playAll();
</script>
</body>
</html>
