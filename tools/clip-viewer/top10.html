<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 10 Formats</title>
<style>
  :root {
    --bg: #0e0f12; --panel: #17181d; --chip: #22242b; --line: #2c2f37; --ink: #ecedf0; --dim: #9a9ca5;
    --yes: #4fbf73; --maybe: #d9a63a; --no: #d0564a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
  nav { width: 250px; flex: none; border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px; }
  nav h1 { font-size: 15px; margin: 2px 8px 12px; text-align: center; }
  nav button { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; color: var(--ink);
    padding: 9px 10px; border-radius: 9px; cursor: pointer; font: inherit; }
  nav button:hover { background: var(--chip); }
  nav button.on { background: var(--chip); outline: 1px solid var(--line); }
  nav .num { color: var(--dim); font-variant-numeric: tabular-nums; width: 18px; flex: none; }
  nav .dot { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex: none; align-self: center; }
  nav .foot { color: var(--dim); font-size: 12px; padding: 14px 10px; }
  main { flex: 1; overflow-y: auto; padding: 22px 28px 40px; }
  header { text-align: center; max-width: 900px; margin: 0 auto 18px; }
  header .n { color: var(--dim); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  header h2 { font-size: 28px; margin: 4px 0 6px; }
  header p { color: var(--dim); margin: 0; font-size: 15px; }
  .marks { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .marks button { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; font-weight: 600; }
  .marks button.on[data-m=use] { background: var(--yes); border-color: var(--yes); color: #08140c; }
  .marks button.on[data-m=maybe] { background: var(--maybe); border-color: var(--maybe); color: #1a1405; }
  .marks button.on[data-m=no] { background: var(--no); border-color: var(--no); color: #1b0806; }
  .clips { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 0 auto 20px; }
  .clip { width: min(270px, 44vw, calc(60vh * 9 / 16)); }
  .clip video { width: 100%; aspect-ratio: 9 / 16; object-fit: contain; background: #000; border-radius: 12px; display: block; cursor: pointer; }
  .clip video.wide { aspect-ratio: 16 / 9; }
  .clip .meta { margin-top: 6px; text-align: center; }
  .clip .meta b { font-size: 15px; }
  .clip .meta span { color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 1000px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card h3 { margin: 0 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .card p { margin: 0; }
  .card.wide { grid-column: 1 / -1; }
  .beats { display: flex; gap: 6px; flex-wrap: wrap; }
  .beats span { background: var(--chip); border-radius: 8px; padding: 5px 10px; }
  .beats i { color: var(--dim); font-style: normal; margin-right: 5px; }
  .keys { text-align: center; color: var(--dim); font-size: 12px; margin-top: 18px; }
  @media (max-width: 760px) { body { flex-direction: column; height: auto; overflow: auto; } nav { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 16px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script>
let data, cur = 0, picks = {};
try { picks = JSON.parse(localStorage.getItem('top10-picks') || '{}'); } catch {}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const COLORS = { use: 'var(--yes)', maybe: 'var(--maybe)', no: 'var(--no)' };

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = `<h1>10 formats for Locturne</h1>` + data.formats.map((f, i) =>
    `<button data-i="${i}" class="${i === cur ? 'on' : ''}"><span class="num">${f.n}</span><span>${esc(f.name)}</span>
     <span class="dot" style="background:${COLORS[picks[f.n]] || 'transparent'}"></span></button>`).join('') +
    `<div class="foot"><b>Left out:</b> ${esc(data.left_out)}</div>`;
  nav.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => show(+b.dataset.i));
}

function show(i) {
  document.querySelectorAll('video').forEach(v => v.pause());
  cur = (i + data.formats.length) % data.formats.length;
  const f = data.formats[cur];
  document.getElementById('main').innerHTML = `
    <header><div class="n">Format ${f.n} of 10</div><h2>${esc(f.name)}</h2><p>${esc(f.short)}</p>
      <div class="marks">${['use', 'maybe', 'no'].map(m => `<button data-m="${m}" class="${picks[f.n] === m ? 'on' : ''}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</div></header>
    <div class="clips">${f.clips.map(c => `<div class="clip"><video src="${esc(c.src)}" poster="${esc(c.src.replace(/\.mp4$/, '.jpg'))}" preload="metadata" loop playsinline muted></video>
      <div class="meta"><b>${esc(c.views)}</b> · ${esc(c.handle)}<br><span>${esc(c.note)}</span></div></div>`).join('')}</div>
    <div class="grid">
      <div class="card wide"><h3>Locturne version</h3><p>${esc(f.locturne)}</p></div>
      <div class="card wide"><h3>Beats</h3><div class="beats">${f.beats.map((b, k) => `<span><i>${k + 1}</i>${esc(b)}</span>`).join('')}</div></div>
      <div class="card"><h3>Evidence</h3><p>${esc(f.evidence)}</p></div>
      <div class="card"><h3>Why it fits</h3><p>${esc(f.fit)}</p></div>
    </div>
    <div class="keys">Click a clip to play with sound · ← → or 1–0 to switch format · M mutes all</div>`;
  document.querySelectorAll('.marks button').forEach(b => b.onclick = () => mark(f.n, b.dataset.m));
  document.querySelectorAll('.clip video').forEach(v => {
    v.addEventListener('loadedmetadata', () => v.classList.toggle('wide', v.videoWidth > v.videoHeight));
    v.onclick = () => {
      const play = v.paused;
      document.querySelectorAll('video').forEach(o => { if (o !== v) o.pause(); });
      if (play) { v.muted = false; v.play(); } else v.pause();
    };
  });
  // Previews: everything plays muted so you see the whole format at once.
  document.querySelectorAll('.clip video').forEach(v => v.play().catch(() => {}));
  renderNav();
  document.getElementById('main').scrollTop = 0;
  try { localStorage.setItem('top10-cur', cur); } catch {}
}

function mark(n, m) {
  picks[n] = picks[n] === m ? undefined : m;
  try { localStorage.setItem('top10-picks', JSON.stringify(picks)); } catch {}
  show(cur);
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'j') show(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'k') show(cur - 1);
  else if (/^[0-9]$/.test(e.key)) show(e.key === '0' ? 9 : +e.key - 1);
  else if (e.key === 'm') document.querySelectorAll('video').forEach(v => v.muted = true);
});

fetch('/top10.json').then(r => r.json()).then(d => {
  data = d;
  let start = 0;
  try { start = +(localStorage.getItem('top10-cur') || 0); } catch {}
  show(start || 0);
});
</script>
</body>
</html>
