<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiny Reveal Lab</title>
<style>
  /* The real payoff (the app's web build, :8090) in ten phone frames, one per reveal draft. */
  :root { --bg: #0a0b0f; --ink: #eceef3; --dim: #8e93a3; --line: #23252f; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; justify-content: center; padding: 12px 16px; background: rgba(10,11,15,.92); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; }
  button, select { background: #eceef3; color: #0a0b0f; border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer; }
  select { background: #1c1e26; color: var(--ink); }
  main { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; padding: 18px; }
  .d { display: grid; gap: 8px; justify-items: center; }
  .frame { width: 215px; height: 466px; border-radius: 30px; overflow: hidden; outline: 1px solid var(--line); background: #000; position: relative; }
  iframe { width: 430px; height: 932px; border: 0; transform: scale(.5); transform-origin: 0 0; position: absolute; inset: 0; }
  .d b { font-size: 13px; }
  .d button { background: #1c1e26; color: var(--ink); font-weight: 600; padding: 5px 12px; }
</style>
</head>
<body>
<header>
  <h1>Shiny reveal lab</h1>
  <label>Moon <select id="moon"></select></label>
  <button id="all">Replay all</button>
  <span style="color:var(--dim)">The real payoff from the web build (npm run web on :8090). The moon rises plain, then the reveal plays.</span>
</header>
<main id="grid"></main>
<script>
const NAMES = ['Rim twinkle', 'Holo sweep', 'Classic three', 'Ping', 'Constellation', 'Second rise', 'Sheen', 'Mark', 'Nudge', 'Quiet'];
const MOONS = ['full', 'moonlight', 'harvest', 'blood', 'bluemoon', 'deepsea', 'strawberry', 'eclipse'];
const sel = document.getElementById('moon');
MOONS.forEach((m) => sel.add(new Option(m, m)));
const url = (fx) => `http://localhost:8090/morning-won?demo=1&over=1&newShiny=${sel.value}&moon=${sel.value}&fx=${fx}&t=${Date.now()}`;
const frames = NAMES.map((n, i) => {
  const d = document.createElement('div'); d.className = 'd';
  d.innerHTML = `<div class="frame"><iframe loading="eager"></iframe></div><b>${i + 1}. ${n}</b><button>Replay</button>`;
  document.getElementById('grid').append(d);
  const f = d.querySelector('iframe');
  const go = () => (f.src = url(i + 1));
  d.querySelector('button').onclick = go;
  return go;
});
const all = () => frames.forEach((go, i) => setTimeout(go, i * 150));
document.getElementById('all').onclick = all;
sel.onchange = all;
all();
</script>
</body>
</html>
