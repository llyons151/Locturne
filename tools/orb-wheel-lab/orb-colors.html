<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orb colours</title>
<!-- Every moon beside its orb: the colours baked before 2026-11-07 (sky + halo) and the ones sampled from the moon's
     own art (tools/moon-lab/orb_colors.py). orb-colors-data.js is generated. -->
<style>
  body { background: #000; color: #fff; font: 13px -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 10px; }
  .m { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; justify-content: center; align-items: center; background: #0b0c10; border-radius: 14px; padding: 10px 6px 8px; }
  .m img { width: 64px; height: 64px; object-fit: contain; }
  .m b { grid-column: 1 / -1; text-align: center; font-weight: 600; }
  .m span { text-align: center; color: #8a8fa0; font-size: 10px; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script src="orb-render.js"></script>
<script src="orb-colors-data.js"></script>
<script>
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
const g = document.getElementById('g');
for (const m of ORB_COLORS) {
  const el = document.createElement('div'); el.className = 'm';
  el.innerHTML = `<b>${m.name}</b><img src="${m.moon}">`;
  for (const pal of [m.old, m.new]) { const c = orb(null, 64); c._pal = pal.map(hex); el.append(c); }
  el.insertAdjacentHTML('beforeend', '<span>moon</span><span>before</span><span>from art</span>');
  g.append(el);
}
window.__ready = true;
</script>
</body>
</html>
